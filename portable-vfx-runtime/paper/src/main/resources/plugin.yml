name: PortableVFX
version: '${version}'
main: dev.portablevfx.paper.PortableVfxPlugin
api-version: '1.21.4'
description: Independent visual-only effect relay for compatible PortableVFX clients.
authors: [PortableVFX]
softdepend: [MagicCodexBridge]
commands:
  pvfxserverdebug:
    description: Generic PortableVFX relay and server-authoritative Claude visual test
    usage: /pvfxserverdebug <play|follow|catalog|event|finish|stop|clear|status|reload>
    permission: portablevfx.admin
permissions:
  portablevfx.admin:
    description: Use PortableVFX administrative visual-effect commands
    default: op
