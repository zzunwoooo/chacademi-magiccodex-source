<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차카데미 마법 수정안</title><link rel="stylesheet" href="review.css"><script src="../discovery-editor-v1/icon-preview.js"></script></head>
<body>
<header><div><span class="eyebrow">차카데미 · 마법 정리</span><h1>마법 300종 정리</h1><p>효과는 간결하게, 획득 단서는 설명 속에. 기존 200종과 신규 100종을 함께 편집할 수 있습니다.</p></div><button id="export">수정본 내보내기</button></header>
<div class="summary"><span><b>300</b> 전체 작성</span><span><b>100</b> 신규 완성</span><span><b>8</b> 독서 획득</span><span>설명에 획득 단서 포함</span></div>
<nav id="tabs"><button data-scope="all" class="active">전체 300</button><button data-scope="existing">기존 200</button><button data-scope="new">신규 100</button></nav>

<main><aside id="list" aria-label="마법 목록"></aside><section id="detail"></section></main>
<footer><span id="save-state">검토안 준비됨</span><span>게임 효과·획득 판정은 별도 구현 단계입니다. 이 화면은 런처·서버를 변경하지 않습니다.</span></footer>
<script src="review-data.js"></script><script src="review.js"></script>
