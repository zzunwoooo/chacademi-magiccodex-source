research: 와이번들이 회전목마 돌풍에 휘말려 떨어진 뒤에도 원은 쉽게 멈추지 않았다. 원 한가운데에 날개를 세우자, 돌풍 전체가 하나의 거대한 바람개비로 묶였다.
