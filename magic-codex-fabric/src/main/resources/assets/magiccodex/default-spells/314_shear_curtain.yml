research: 검치호의 송곳니가 코앞에서 바람 톱에 부서지던 순간, 원반 하나로는 모자라다는 것을 알았다. 원반을 세로로 길게 펼치자, 숲 하나를 가로막을 장막이 되었다.
cast:
  command: 마법 shear_curtain
