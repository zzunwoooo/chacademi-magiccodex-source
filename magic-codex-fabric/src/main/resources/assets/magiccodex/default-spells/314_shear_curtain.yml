id: shear_curtain
name: 칼바람 장막
category: wind
description: 앞으로 나아가는 거대한 세로 바람 장막을 펼칩니다. 장막에 휩쓸린 적은 모두 베이고, 장막이 멈추는 자리에서 칼바람이 흩어지며 한 번 더 벱니다.
icon: ''
permission: magic.learned.shear_curtain
discovery:
