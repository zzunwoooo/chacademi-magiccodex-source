research: 서리 정원을 수없이 피워 낸 땅에서 빙핵의 수호자가 또 하나 쓰러졌다. 녹지 않고 남은 결정들이 한 점으로 모여 하늘을 향해 자라기 시작했다. 정원에도 파수꾼이 필요했던 것이다.
