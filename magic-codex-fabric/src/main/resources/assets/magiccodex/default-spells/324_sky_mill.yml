id: sky_mill
name: 천공의 방아
category: wind
description: 하늘에서 거대한 바람 풍차를 내려 조준한 곳을 통째로 갈아 버립니다. 풍차가 점점 빨라지며 땅 위의 적을 베고, 가운데 회오리로 적을 띄워 올린 뒤 하늘의 압력으로 한꺼번에 내리찍어 기절시킵니다.
icon: magiccodex:textures/spells/nova150/sky_mill.png
permission: magic.learned.sky_mill
discovery:
  description: 큐디치 경기에서 스니치를 3번 잡기.
research: 스니치는 빛나지도 않고 소리도 없다. 하늘의 바람을 맷돌처럼 갈아 그 흐름이 비는 곳을 찾으면 거기 있다. 세 번을 잡고 나니, 하늘 전체가 내 손안에서 돌아가는 방아처럼 느껴졌다.
cast:
  command: 마법 sky_mill
  cooldown-seconds: 200
  mana-cost: 380
order: 324
