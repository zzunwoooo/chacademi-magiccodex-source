id: forge_god_anvil
name: 대장장이 신의 모루
category: fire
description: 하늘을 갈라 대장장이 신의 모루를 떨어뜨리고, 거대한 망치로 세 번 내리칩니다. 마지막 일격에 주변의 적은 기절하고, 갈라진 땅에서 쇳물이 솟구쳐 남은 적을 불태웁니다.
icon: magiccodex:textures/spells/nova150/forge_god_anvil.png
permission: magic.learned.forge_god_anvil
discovery:
  description: 「대장장이 신의 모루」 마법 스크롤 사용하기.
research: 옛 대장장이들의 무덤 가장 깊은 곳, 녹슨 모루 아래에 그 기록이 깔려 있었다. 누가 남겼는지는 아무도 모른다. 첫 줄을 소리 내어 읽자 하늘에서 망치 소리가 울렸고, 둘째 줄에서 땅이 울었으며, 셋째 줄에서는 내 심장이 울렸다. 종이를 내려놓았을 때, 나는 쇠가 아니라 세상을 두드리는 법을 알고 있었다.
cast:
  command: 마법 forge_god_anvil
  cooldown-seconds: 200
  mana-cost: 400
order: 349
