discovery:
  description: 마법봉 하나를 한 번도 실패하지 않고 끝까지 강화하기.
research: 전설의 대장장이는 망치를 열 번 내리쳐 한 번도 빗나가지 않았다고 한다. 그 모루 위에서 태어난 봉은 지금도 불꽃 대신 별을 튀긴다.
cast:
