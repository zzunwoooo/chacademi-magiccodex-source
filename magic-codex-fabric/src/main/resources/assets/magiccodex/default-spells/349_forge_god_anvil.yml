id: forge_god_anvil
name: 대장장이 신의 모루
category: fire
description: 하늘을 갈라 대장장이 신의 모루를 떨어뜨리고, 거대한 망치로 세 번 내리칩니다. 마지막 일격에 주변의 적은 기절하고, 갈라진 땅에서 쇳물이 솟구쳐 남은 적을 불태웁니다.
icon: magiccodex:textures/spells/nova150/forge_god_anvil.png
