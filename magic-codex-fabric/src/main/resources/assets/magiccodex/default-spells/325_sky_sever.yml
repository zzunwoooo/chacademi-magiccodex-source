id: sky_sever
name: 창공 절단
category: wind
description: 하늘을 정면으로 길게 베어 갈라 진공 균열을 엽니다. 균열에서 거대한 바람 칼날이 떨어져 일직선 위의 적을 모두 베고, 땅에 남은 흉터가 차례로 터진 뒤 균열이 닫히며 다시 한번 한꺼번에 폭발합니다.
icon: ''
permission: magic.learned.sky_sever
discovery:
  description: 천공의 방아·무풍지대·연날리기 축제를 익힌 뒤, 천공의 방아로 몬스터 50마리 처치하기.
research: 천공의 방아가 땅을 갈고 지나간 자리마다 하늘에 가느다란 금이 남았다. 무풍의 고요를 품고 연의 실을 손에 쥔 채 그 금을 따라 손을 내리긋자, 창공이 솔기처럼 벌어졌다. 그 너머의 진공은 바람조차 숨을 죽이는 곳이었고, 거기서 떨어진 칼날은 하늘 끝에서 땅 끝까지 단숨에 갈랐다.
cast:
  command: 마법 sky_sever
  cooldown-seconds: 220
  mana-cost: 400
order: 325
