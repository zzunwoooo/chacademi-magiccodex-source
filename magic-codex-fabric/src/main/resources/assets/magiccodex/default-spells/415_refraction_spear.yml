research: 봉인의 기사가 방패를 세울 때마다 색유리 파편이 그 둘레로 휘어 들어갔다. 빛이 곧게 가지 않아도 된다는 것을 알게 된 순간, 손에 쥔 빛이 창이 되어 렌즈 두 개를 지나 꺾였다.
