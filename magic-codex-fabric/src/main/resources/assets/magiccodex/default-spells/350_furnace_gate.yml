id: furnace_gate
name: 용광로의 문
category: fire
description: 하늘에 거대한 용광로의 문을 열어 쇳물과 불길을 폭포처럼 쏟아붓습니다. 문이 닫히는 순간 전장 전체가 폭발하고, 부서진 문의 파편이 불비가 되어 쏟아집니다.
icon: magiccodex:textures/spells/nova150/furnace_gate.png
permission: magic.learned.furnace_gate
discovery:
  description: 「용광로의 문」 마법 스크롤 사용하기.
research: "[출입 금지 — 이 아래 봉인된 기록을 꺼내지 말 것] 녹아내린 철문 너머, 불길이 한 번도 꺼진 적 없는 방에 그 두루마리가 있었다고 한다. 펼친 자들은 하나같이 같은 말을 남겼다. 하늘 한가운데에서 쇠 빗장이 풀리는 소리를 들었다고. 문 너머에서 태초의 불이, 아직 꺼지지 않은 채 기다리고 있었다고."
cast:
  command: 마법 furnace_gate
  cooldown-seconds: 220
  mana-cost: 420
order: 350
