research: 보이지 않는 몬스터는 거울 미궁 안에서만 모습을 드러냈다. 거울에 비친 그것을 쫓다 보니, 거울 속에서 나 역시 누군가를 쫓고 있었다. 내가 검을 휘두르자 거울 속의 나도 함께 휘둘렀다.
