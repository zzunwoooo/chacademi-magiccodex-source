id: great_hourglass
name: 대사막의 모래시계
category: earth
description: 하늘 높이 거대한 모래시계를 불러내 뒤집습니다. 모래가 쏟아지는 동안 주변 적은 느려지며 중심으로 빨려 들고, 마지막 모래알이 떨어지는 순간 대지가 꺼지며 적을 삼킨 뒤 모래 간헐천으로 솟구쳐 올립니다.
icon: magiccodex:textures/spells/nova150/great_hourglass.png
permission: magic.learned.great_hourglass
discovery:
  description: 「대사막의 모래시계」 마법 스크롤 사용하기.
research: 봉인된 통은 가장 깊은 방, 쓰러진 문지기 뒤에 놓여 있었다. 끈을 풀자 종이 대신 마른 알갱이가 쏟아졌고, 그 소리는 오래된 시계의 초침 같았다. 고개를 들자 하늘만 한 유리 그릇이 천천히 뒤집히고 있었다. 마지막 한 알이 떨어지는 순간 대지가 꺼지며 모든 것을 삼켰고, 그제야 알았다. 시간은 흐르는 것이 아니라 쌓이는 것이며, 쌓인 것은 언젠가 반드시 무너진다는 것을.
cast:
  command: 마법 great_hourglass
  cooldown-seconds: 200
  mana-cost: 400
order: 399
