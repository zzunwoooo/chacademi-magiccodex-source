id: desertify
name: 사막화
category: earth
description: 주변 7블록을 8초 동안 메마른 사막으로 바꿉니다. 사막 위의 적은 모래에 발이 빠져 느려지고, 나는 모래바람을 타고 빨라집니다.
icon: magiccodex:textures/spells/nova150/desertify.png
