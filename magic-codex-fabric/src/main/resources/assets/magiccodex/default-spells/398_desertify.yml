research: 모래관과 모래 폭포로 쏟아부은 모래가 선인장밭 한가운데 언덕처럼 쌓였다. 그 위에 서자 주위의 풀이 마르고 땅이 갈라졌지만, 메마른 바람은 오히려 내 발걸음을 가볍게 밀어 주었다.
