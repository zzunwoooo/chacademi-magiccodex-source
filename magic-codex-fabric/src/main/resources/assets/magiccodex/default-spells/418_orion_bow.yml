description: 하늘에 별빛으로 된 거대한 활을 그려 시위를 당깁니다. 잠시 뒤 바라보는 방향으로 굵은 빛의 화살이 날아가 일직선 위의 적을 모두 꿰뚫습니다.
icon: magiccodex:textures/spells/nova150/orion_bow.png
