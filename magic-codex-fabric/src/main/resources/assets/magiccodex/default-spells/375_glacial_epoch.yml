id: glacial_epoch
name: 영겁의 빙하
category: water
description: 조준한 곳을 중심으로 넓은 땅을 영원한 빙하 시대로 되돌립니다. 퍼지는 서리가 적을 느리게 만들고 거대한 빙하 기둥들이 솟아오른 뒤, 모든 기둥이 산산조각 나고 절대영도의 일격이 내리꽂혀 적을 얼려 버립니다.
icon: ''
permission: magic.learned.glacial_epoch
discovery:
  description: 천상의 물시계·빙하 결정탑·결빙 화음을 익힌 뒤, 빙핵의 수호자 30마리 처치하기.
research: 하늘의 물시계와 빙하의 결정탑과 얼음의 화음을 모두 품은 채, 나는 빙핵의 수호자들을 하나씩 잠재웠다. 마지막 수호자의 심장이 식어 가던 순간, 그 속에 갇혀 있던 수만 년 전의 겨울이 내 안으로 흘러들었다. 눈을 떴을 때 들판은 하얗게 멈춰 있었고, 하늘에는 커다란 눈꽃 하나가 떨어질 때를 기다리고 있었다. 세상이 다시 녹기 시작한 것은 내가 숨을 내쉰 뒤였다.
cast:
  command: 마법 glacial_epoch
  cooldown-seconds: 220
  mana-cost: 420
order: 375
