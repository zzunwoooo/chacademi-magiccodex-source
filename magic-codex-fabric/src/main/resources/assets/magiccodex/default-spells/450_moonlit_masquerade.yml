id: moonlit_masquerade
name: 월하 가면무도회
category: dark
description: 달빛 아래 그림자 무도가 열두 명을 불러 가면무도회를 엽니다. 무도가들은 춤추며 무대 위의 적들을 베고, 가면을 벗는 순간 한가운데로 모여 일격을 가한 뒤 하늘에서 칼날 비를 쏟아 적들을 쓰러뜨립니다.
icon: magiccodex:textures/spells/nova150/moonlit_masquerade.png
permission: magic.learned.moonlit_masquerade
discovery:
  description: 「월하 가면무도회」 마법 스크롤 사용하기.
research: 초대장. 귀하를 달 아래 무도회에 모십니다. 이 두루마리는 무너진 성의 가장 안쪽, 아무도 돌아오지 못한 방에 잠들어 있었으며, 봉인을 푸는 분이 곧 주인이 됩니다. 가면은 꼭 지참하십시오. 얼굴은 필요 없습니다. 마지막 곡이 끝날 때, 객석에 남은 이는 없을 것입니다.
cast:
  command: 마법 moonlit_masquerade
  cooldown-seconds: 200
  mana-cost: 380
order: 450
