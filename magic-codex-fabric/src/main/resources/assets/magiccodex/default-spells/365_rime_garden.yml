research: 빙핵의 수호자 셋을 쓰러뜨린 얼음 들판에 결빙 파동의 흔적이 겹겹이 남아 있었다. 다음 날 아침 그 동그라미마다 서리꽃이 피어 있는 것을 보고, 정원을 가꾸는 법을 알았다.
