research: 바실리스크의 눈빛을 피하려 고드름 처마 아래로 몸을 숨겼다. 고드름 하나로는 그 단단한 비늘을 뚫지 못했고, 나는 처마째로 떨어뜨리고 싶다고 간절히 바랐다. 하늘이 그 바람을 들어주었다.
