# 차카데미 스토리 진행 단계. 명령어(/대화관리 단계 ...)로 고치면 이 파일이 바로 저장됩니다.
# 직접 고친 뒤에는 /서버관리 새로고침 스토리. 키 설명은 플러그인 기본 steps.yml 머리 주석 참고.
#
# 1장 다시 짜기 (2026-10-26, 오너) — 표·NPC 번호 정할 곳: docs/plans/story-ch1-v2.md
#   대화 ID = 단계 ID (예전 초안이 ch1-14 에서 ch1-12 를 다시 쓰던 것 고침). 대화 파일: deployment/story-dialogues/
#   서버: 전부 school (오너 2026-10-26: 튜토리얼 맵을 school 서버에 넣음 — 따로 튜토리얼 서버 없음). 배 컷신 뒤 ch1-8 시작명령으로 항구 워프.
#   (서버이동 키는 쓰지 않음)
#   이 파일을 school 서버 plugins/ChacademyStory/steps.yml 에 넣는다.
#   NPC: -1 = 아직 안 정함 → 그 단계에서 멈춤. 게임 안에서 /대화관리 단계 <단계> 호출 NPC클릭 → 30초 안에 그 NPC 클릭.

