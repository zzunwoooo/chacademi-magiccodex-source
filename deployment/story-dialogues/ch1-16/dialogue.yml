      - {who: luka, face: "기본", text: "여기 교감 선생님이 엄청 무섭대. 틀리면 첫날부터 벌점이래…"}
      - {who: gregor, face: "기본", text: "…새로 온 학생들인가."}
      - {who: luka, face: "기본", text: "헉! 안, 안녕하세요!"}
      - {who: gregor, face: "기본", text: "차카데미아 교감 그레고르다. 입학을 환영한다."}
      - {who: gregor, face: "기본", text: "{player}. 엘레나 교수에게 이야기는 들었다. 첫날 상승기류를 발현했다고."}
      - {who: luka, face: "기본", text: "뭐? 첫날에? 나는 아직 하나도 못 했는데…"}
    choices:
      - {text: "운이 좋았을 뿐이에요.", to: "b"}
      - {text: "감사합니다!", to: "c"}
  b:
    name: "운"
    lines:
      - {who: gregor, face: "기본", text: "운이든 아니든, 발현했다는 게 중요하다."}
    next: e
  c:
    name: "칭찬"
    lines:
      - {who: gregor, face: "기본", text: "칭찬이 아니다. 할 일을 알려 주는 것뿐이다."}
    next: e
  e:
    name: "기숙사로"
    lines:
      - {who: gregor, face: "기본", text: "백 년 전 우리는 수많은 기록과 사람을 잃었다. 학생 하나하나가 이 학교의 빈칸을 채운다."}
      - {who: gregor, face: "기본", text: "먼저 기숙사를 정할 차례다. 따라오도록."}
