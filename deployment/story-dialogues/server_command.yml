# 차카데미 스토리 — 대화가 "끝까지 정상으로" 끝났을 때 실행할 콘솔 명령 (2026-10-26 1장 다시 짜기)
# 위치: plugins/ChacademyStory/dialogues/server_command.yml — 학교(school)·튜토리얼(tutorial) 서버 모두 같은 파일
# 고친 뒤: /서버관리 새로고침 스토리
#
# 키 = 대화 ID (정확히 같은 이름만). {player} = 계정 이름, {ending} = 서버가 확인한 결말 장면.
# 지급(아이템·마법 조건·상점 대상)은 전부 steps.yml 의 시작명령(-한번)에서 한다. 여기에는 결말이 필요한 것만.
#
# 1장 대화 번호 = 단계 번호 (2026-10-26): ch1-17 = 분류의 거울 6문항 → 결과 ch1-17r-/m-/f-<기숙사> (SchoolBridge 가 띄움)

commands:
  # 엘레나 인사가 끝나면 하수구(구덩이)로 (예전 '하수구' 명령은 학교 서버에 없음). ★ 좌표는 오너가 정함
  # ch1-3:
  #   - "minecraft:execute in minecraft:overworld run tp {player} X Y Z"

  # 브람 "출항이다!" 대화가 끝나면 바로 항구로 (배 컷신이 화면을 덮는 동안 옮겨 둠). ch1-8 시작명령과 같은 자리
  ch1-7:
    - "minecraft:execute in minecraft:overworld run tp {player} 32.5 71 143.5 0 0"

  # 분류의 거울 6문항이 끝나면 고른 결말(p_TD)로 기숙사 배정 → 결과 대사(ch1-17r/m/f-<기숙사>)를 띄움.
  # 이 줄이 없으면 6문항을 끝내도 배정되지 않아 1장이 멈춤 (/대화관리 단계 점검 이 경고함). 필수.
  ch1-17:
    - "기숙사분류 결정 {player} {ending}"
