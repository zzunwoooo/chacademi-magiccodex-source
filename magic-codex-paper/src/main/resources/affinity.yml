# NPC 호감도 (ChacaNPC 연동). 점수의 주인은 MagicCodexBridge.
# 저장: database.properties 가 mariadb 면 codex_affinity / codex_affinity_daily / codex_affinity_gift (school·wild 공유)
#       sqlite 면 이 폴더의 affinity.db
timezone: "Asia/Seoul"

# 출처별 하루 상승 한도 (NPC 하나당). 0 = 한도 없음. 음수 변화(장난·질투)는 한도 없이 적용
daily-caps:
  chat: 3        # AI 대화로 오르는 양
  quest: 10      # 부탁(퀘스트) 관련
  dialogue: 0    # 고정 대화 동작 custom affinity
  nickname: 2    # 호칭 이벤트
# 위에 없는 출처의 하루 한도
default-daily-cap: 5

# NPC 하나에게 하루 선물 횟수
gift-daily-count: 1

# (2026-10-21부터 쓰지 않음) 선물 도중 멈춘 기록은 시작 때 일괄 확정하지 않고,
# 유저가 선물을 시작한 서버에 접속할 때 아이템 차감 영수증으로 확정·취소한다. 옛 기록은 /유저관리 <닉네임> 호감도 선물기록
recover-pending-gift-minutes: 10

# 점수: 기본 0 · 최대 100. 30 · 60 · 90 에서 멈추고, 그 NPC 의 호감도 퀘스트를 깨야 다음 구간이 열림 (2026-10-23)
#   깬 단계 h (custom heart <npc> h): h 0 → 30, 1 → 60, 2 → 90, 3 이상 → 100
#   상한에 닿아 있으면 선물을 받지 않음 (ChacaNPC "지금은 괜찮아~", 아이템·하루 선물 횟수 차감 없음)
# 고정 대화에서 쓰는 방법:
#   조건  custom affinity ella>=20   /   custom affinity ella heart<1
#   동작  custom heart ella 1      (하트 이벤트 1 완료 → 상한 해제, ChacaNPC 소문)
#   동작  custom affinity ella +5
#   동작  custom nickname ella 책벌레
