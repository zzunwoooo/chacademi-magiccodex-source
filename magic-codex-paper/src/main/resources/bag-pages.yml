# 아공간 배낭 (서바이벌 인벤토리 2·3쪽) — 2026-10-24
#
# 1쪽은 모두 열려 있고, 가방 확장권을 우클릭할 때마다 다음 쪽이 열립니다 (최대 3쪽).
# 열린 쪽 수는 모든 서버가 같이 씁니다 (DB 공유).
# 쪽을 넘기면 인벤토리 27칸이 그 쪽에 저장된 아이템과 통째로 바뀝니다. 핫바 9칸은 그대로입니다.

# 이 서버의 이름. 서버마다 반드시 달라야 합니다 (예: school, wild).
# 서버마다 인벤토리가 따로라서 저장된 쪽도 서버별로 따로 둡니다. 같은 이름을 쓰면 서로 덮어써서 아이템이 사라질 수 있습니다.
# 비워 두면 quests.yml 의 server-id 를 그대로 씁니다.
server-id: ""

# 가방 확장권 ItemsAdder 아이템 id (namespace:id). 이 아이템을 우클릭하면 1개 쓰고 다음 쪽이 열립니다.
unlock-item: "item:bag_expansion"
# 알림 문구에 쓰는 이름
unlock-item-name: "가방 확장권"
