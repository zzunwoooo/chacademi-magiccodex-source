name: MagicCodexBridge
version: '${version}'
main: school.magiccodex.paper.MagicCodexBridge
api-version: '1.21.4'
description: Permission, balance, server-authoritative mana and spell casting for Magic Codex.
softdepend: [LuckPerms, Vault, PlaceholderAPI, MCPets, MythicMobs, ModelEngine, Citizens]
commands:
  마법:
    description: 발견한 마법을 마나와 마법 가속을 적용해 시전합니다.
    aliases: [codexcast]
  마법관리:
    description: 마법 실행 목록을 다시 불러옵니다.
    permission: magiccodex.mana.admin
  칭호:
    description: 보유한 접두사와 접미사를 선택합니다.
    aliases: [codextitles]
    permission: magiccodex.titles
  칭호관리:
    description: 칭호 지급, 회수 및 설정 관리
    permission: magiccodex.titles.admin
  대화:
    description: 관리자용 실제 NPC 대화 실행
    permission: magiccodex.dialogue.admin
  대화관리:
    description: NPC 대화 편집, 미리보기 및 YAML 반영
    permission: magiccodex.dialogue.admin
  메인퀘스트:
    description: 진행 중인 이야기 기록
    permission: magiccodex.dialogue
  의뢰:
    description: 학교 의뢰 게시판을 엽니다.
    aliases: [의뢰게시판, questboard]
    permission: magiccodex.quests
  의뢰관리:
    description: 의뢰 초안 편집 및 공용 설정 반영
    permission: magiccodex.quests.admin
  이로치관리:
    description: 바라보는 교화 대상의 이로치 설정
    aliases: [codexshiny]
    permission: magiccodex.shiny.admin
  교화:
    description: 바라보는 대상을 교화합니다.
    aliases: [codextame]
    permission: magiccodex.taming
  교화관리:
    description: 교화 설정과 예시 몹 관리
    aliases: [codextaming]
    permission: magiccodex.taming.admin
  마력재구성:
    description: 강화 초기화, 실패 복구, 코어 성향 변경
    permission: magiccodex.reconfigure
  재구성관리:
    description: 재구성 사용권 지급 및 구형 마법봉 원본 등록
    permission: magiccodex.reconfigure.admin
  강화:
    description: 마법봉 회로 강화
    permission: magiccodex.enhance
  마법봉:
    description: 마법봉 등록 및 강화 설정
    permission: magiccodex.enhance.admin
  마력코어:
    description: 미감정 코어 지급 및 설정 관리
    permission: magiccodex.core.admin
  코어감정:
    description: 주 손 마력코어 감정
    permission: magiccodex.core.use
  장비설정:
    description: Tag the held accessory and its equipment bonuses.
    permission: magiccodex.equipment.admin
  기숙사점수:
    description: School house standings and administrator point adjustments.
    aliases: [학교기증, 학교점수]
    permission: magiccodex.school
  기증기록:
    description: Reset donation records or reload donation catalog.
    permission: magiccodex.school.admin
  codexclimate:
    description: Manage season progression and climate settings.
    permission: magiccodex.climate.admin
  codexpets:
    description: Reload pet codex grades and MCPets integration.
    permission: magiccodex.pets.admin
  codextemp:
    description: Set the temperature sent to a player's HUD.
    permission: magiccodex.temperature.admin
  서클승급:
    description: Open the permission-checked circle ascension screen.
    aliases: [circleascend]
    permission: magiccodex.ascend
  친구:
    description: Open the friends list.
    aliases: [친구창, codexfriends]
    permission: magiccodex.friends
  스텟창:
    description: Open a player's public stats in Magic Codex.
    aliases: [스탯창, codexstats]
    permission: magiccodex.stats.view
  codexmana:
    description: Manage player mana and reload server spell costs.
    permission: magiccodex.mana.admin
permissions:
  magiccodex.titles:
    default: true
  magiccodex.titles.admin:
    default: op
  magiccodex.dialogue:
    default: true
  magiccodex.dialogue.admin:
    default: op
  magiccodex.quests:
    default: true
  magiccodex.quests.admin:
    default: op
  magiccodex.shiny.admin:
    default: op
  magiccodex.taming:
    default: true
  magiccodex.taming.admin:
    default: op
  magiccodex.reconfigure:
    default: true
  magiccodex.reconfigure.admin:
    default: op
  magiccodex.enhance:
    default: true
  magiccodex.enhance.admin:
    default: op
  magiccodex.core.admin:
    default: op
  magiccodex.core.use:
    default: true
  magiccodex.equipment:
    default: true
  magiccodex.equipment.admin:
    default: op
  magiccodex.school:
    default: true
  magiccodex.donate:
    default: true
  magiccodex.school.admin:
    default: op
  magiccodex.house.arkeon:
    default: false
  magiccodex.house.lumina:
    default: false
  magiccodex.house.bestiaz:
    default: false
  magiccodex.house.noxer:
    default: false
  magiccodex.climate.admin:
    default: op
  magiccodex.pets:
    default: true
  magiccodex.pets.admin:
    default: op
  magiccodex.temperature.admin:
    default: op
  magiccodex.ascend:
    default: true
  magiccodex.ascend.2:
    default: false
  magiccodex.ascend.3:
    default: false
  magiccodex.ascend.4:
    default: false
  magiccodex.ascend.5:
    default: false
  magiccodex.ascend.6:
    default: false
  magiccodex.ascend.7:
    default: false
  magiccodex.ascend.8:
    default: false
  magiccodex.ascend.9:
    default: false
  magiccodex.friends:
    default: true
  magiccodex.stats.view:
    default: true
  magiccodex.mana.admin:
    default: op
