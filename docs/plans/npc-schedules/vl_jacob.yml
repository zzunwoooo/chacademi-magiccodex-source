  - 소란
  knows:
  - 차카데미아는 100년 전 '잿빛 밤' 이후 쇠락한 마법학교
  - '공식 역사: 배신자 모르디안이 악마를 불러냈고 대마법사가 봉인함'
  - 마을 광장의 대마법사 동상
  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 마을 경비 구역
  - 숲이 1년 전부터 위험해진 것
  - 항구 출입
  - '내 겉모습: 짧은 은발에 날카로운 눈, 가죽 갑옷과 마을 문장이 그려진 빨간 망토, 긴 창'
  never_knows:
  - 주인공의 전생
  - 모르디안에 대한 진실
  - 천사상
  - 지하 던전 깊은 곳의 일
  - 2장 이후 메인 스토리 사건
  sample_lines:
  - 해 지면 숲 쪽은 가지 마십시오. 요즘 짐승들이 사납습니다.
  - 학생이시군요. 통금 전엔 돌아가십시오.
  - 광장 동상 앞에선 소란 피우지 마십시오.
sample_lines_by_stage:
  2:
  - 학생이 다녀가면 마음이 놓입니다. 조심히 다니십시오.
