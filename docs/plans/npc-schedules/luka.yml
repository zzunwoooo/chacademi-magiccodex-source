  - 마을 광장의 대마법사 동상
  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 같은 해 입학한 신입생
  - 학교 생활 첫해의 설렘
  - 신입생들 사이 소문
  - '내 겉모습: 부스스한 갈색 머리에 클로버 머리핀, 중립 색 학교 로브와 느슨한 넥타이, 머리 뒤로 손을 얹는 버릇'
  never_knows:
