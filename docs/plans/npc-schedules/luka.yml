  - 모르디안에 대한 진실
  - 천사상
  - 지하 던전 깊은 곳의 일
  - 2장 이후 메인 스토리 사건
  - 주인공이 누구의 환생인지
  - 악마 강림과 4장 이후 사건
  sample_lines:
  - 야, 너도 신입생이지? 우리 같은 해 입학한 거다!
  - 지하 던전? 으악, 난 안 가. 절대. …진짜 갈 거야?
  - 같이 다니자! 혼자 다니면 무섭단 말이야.
sample_lines_by_stage:
