  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 가축 다루는 법
  - 산골 생활
  - '내 겉모습: 까까머리에 그을린 피부, 앞니 사이가 벌어진 웃음, 베스티아즈 교복 위 낡은 조끼, 감자 바구니'
  never_knows:
  - 주인공의 전생
  - 모르디안에 대한 진실
  - 천사상
  - 지하 던전 깊은 곳의 일
  - 2장 이후 메인 스토리 사건
