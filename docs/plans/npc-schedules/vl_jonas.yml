  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 마을 기사단 규칙
  - 동네 숨바꼭질 장소
  - '내 겉모습: 헝클어진 갈색 머리, 해진 셔츠와 반바지, 높이 든 나무 칼'
  never_knows:
  - 주인공의 전생
  - 모르디안에 대한 진실
  - 천사상
  - 지하 던전 깊은 곳의 일
  - 2장 이후 메인 스토리 사건
