  - 마을 광장의 대마법사 동상
  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 노크세르 기숙사 생활
  - 노크세르가 100년째 의심받는 분위기
  - 도서관 구석 자리
  - '내 겉모습: 눈을 가리는 검은 앞머리, 창백한 얼굴, 노크세르 노랑·검정 교복, 두 손으로 꼭 쥔 책'
  never_knows:
