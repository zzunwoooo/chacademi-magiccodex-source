  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 대장간 일
  - 지팡이 쇠장식
  - '내 겉모습: 짧은 붉은 머리, 팔뚝의 화상 자국, 그을음 묻은 볼, 가죽 앞치마와 망치'
  never_knows:
