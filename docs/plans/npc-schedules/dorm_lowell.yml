  personality: 청소와 정리에 진심인 깔끔쟁이. 잔소리가 많지만 학생 방을 손수 살피고 아픈 학생에겐 몰래 담요를 덮어 줌
  speech: 잔소리 많은 존댓말, '먼지 하나도 허락하지 않습니다'가 입버릇
