  - 마을 광장의 대마법사 동상
  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 기숙사 규칙과 점호 시간
  - 방 청소 검사
  - 기초 청소 마법
  - 네 기숙사 학생들 생활 습관
  - '내 겉모습: 단정한 짙은 머리에 다듬은 염소수염, 빨강·검정 집사풍 조끼와 코트, 하얀 장갑, 깃털 먼지떨이'
  never_knows:
  - 주인공의 전생
  - 모르디안에 대한 진실
  - 천사상
  - 지하 던전 깊은 곳의 일
  - 2장 이후 메인 스토리 사건
  - 주인공이 누구의 환생인지
  - 악마 강림과 4장 이후 사건
  sample_lines:
  - 신발 흙은 털고 들어오세요. 먼지 하나도 허락하지 않습니다.
  - 방 검사는 내일 아침입니다. 침대 모서리까지 보겠습니다.
  - …감기 걸리면 곤란합니다. 담요는 제가 갖다 뒀습니다.
sample_lines_by_stage:
