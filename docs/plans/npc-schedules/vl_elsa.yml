  - 마을 광장의 대마법사 동상
  - '네 기숙사: 아르케온(불·땅), 루미나(빛·물), 베스티아즈(바람·야수), 노크세르(어둠)'
  - 1년 전부터 숲의 동물들이 난폭해짐
  - 발견한 마법은 학교에 기증하는 것이 미덕
  - 빵집 메뉴와 가격
  - 단골손님 이름
  - '내 겉모습: 두 갈래로 땋은 갈색 머리, 볼과 코끝의 밀가루, 작은 앞치마, 빵 바구니'
  never_knows:
