<!doctype html><html lang="ko"><meta charset="utf-8"><title>API 상자 PNG 미리보기</title><style>body{background:#101c2b;color:#fff;font:16px sans-serif;margin:28px}main{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}figure{margin:0;text-align:center}img{width:100%;background:repeating-conic-gradient(#26364a 0% 25%,#1b2939 0% 50%) 50%/24px 24px}#anim{width:380px}button{padding:12px;margin:4px}a{color:#9de}</style><h1>API 상자 · 동일 방향 / 투명 PNG</h1><main></main><h2>동일 캔버스 전환 확인</h2><img id="anim" src="assets/chest_closed.png"><p id="buttons"></p><p>1254×1254 원본 전체 캔버스 사용. 바닥 기준점 약 (698,1134). 서버/게임 구현이 아닌 자산 미리보기입니다.</p><p><a href="reference/reference-corrected.png">수정 레퍼런스</a> · <a href="docs/Claude_개발프롬프트.txt">Claude 전달 프롬프트</a></p><script>const names=['closed','open_common','open_rare','open_unique','open_legendary'],labels=['닫힘','일반','고급','유일','전설']; names.forEach((n,i)=>{document.querySelector('main').innerHTML+=`<figure><img src="assets/chest_${n}.png"><figcaption>${labels[i]}</figcaption></figure>`;let b=document.createElement('button');b.textContent=labels[i];b.onclick=()=>document.querySelector('#anim').src=`assets/chest_${n}.png`;document.querySelector('#buttons').append(b)})</script></html>
