# Combat targets: all living gameplay entities except NPCs and armor stands.
# Legacy pvp-worlds/excluded-tags/excluded-mythic-prefixes are intentionally ignored.
# WorldGuard magic, PvP and invincibility protections still apply.
boss-tags: [chacademia_boss]
boss-mythic-prefixes: [BOSS_]
boss-knockback-multiplier: 0.3

# 개별 기능 ----------------------------------------------------------------
# 만년빙옥: 갇힌 적이 최대 체력의 이 비율 이상 피해를 받으면 풀림
prison-break-damage-ratio: 0.2
# 허공 디딤 발판 블록 (보이는 연출은 PortableVFX 담당이라 기본은 투명 방벽)
platform-material: BARRIER
# 동시에 존재할 수 있는 개수 상한 (서버 보호)
limits:
  bolts: 512
  zones: 256
  marks: 512
# 원소 반응 ----------------------------------------------------------------
# 마법(chahit/chabolt/chazone, element= 값)이 맞으면 원소 표식이 남고, 표식이 있는 동안 다른 원소로 맞히면 반응.
# 반응은 피해를 늘리지 않는 보조 효과 (이동 방해·아군 지원·처치 보상). 보스에게는 이동 방해 없음.
# 매 틱 도는 작업 없음: 적중할 때만 계산. 아이콘은 MagicCodex 모드가 그림 (모드 없는 클라이언트는 패킷 안 받음).
reactions:
  enabled: true
  mark-ticks: 60              # 표식 유지 시간 (20틱 = 1초)
  cooldown-ticks: 60          # 같은 대상이 다시 반응할 수 있기까지
  eclipse-extra-drops: true   # 일식: 8초 안에 처치하면 일반 드롭 한 번 더 (경제 영향 있으면 false)
  icon-range: 48              # 이 거리 안의 플레이어에게만 아이콘 패킷 전송
debug: false
