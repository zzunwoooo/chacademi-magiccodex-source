# 차카데미 마법 미몹 보조 애드온 설정
# 마법 피해 대상 규칙 ------------------------------------------------------
# 플레이어끼리 마법 피해를 허용할 월드 이름 (비어 있으면 PvP 마법 피해 없음 - PvP 기준은 아직 미정)
pvp-worlds: []
# 이 접두사로 시작하는 MythicMobs 몹은 마법 피해 대상에서 제외 (마법 소환물, 던전 기믹)
excluded-mythic-prefixes: [CHA_, GM_]
# 이 스코어보드 태그를 가진 엔티티는 제외 (펫, NPC, 연출용)
excluded-tags: [chacademia_pet, chacademia_npc, chacademia_taming_fx]
# 보스 판정: 처형·빙옥·넉백 감소에 사용
boss-tags: [chacademia_boss]
boss-mythic-prefixes: [BOSS_]
boss-knockback-multiplier: 0.3

# 개별 기능 ----------------------------------------------------------------
# 만년빙옥: 갇힌 적이 최대 체력의 이 비율 이상 피해를 받으면 풀림
prison-break-damage-ratio: 0.2
# 허공 디딤 발판 블록 (보이는 연출은 PortableVFX 담당이라 기본은 투명 방벽)
platform-material: BARRIER
# 동시에 존재할 수 있는 개수 상한 (서버 보호)
limits:
  bolts: 512
  zones: 256
  marks: 512
debug: false
