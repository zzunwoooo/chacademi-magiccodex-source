<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>호박 리퍼 미리보기</title>
<style>
:root{--bg:#17121c;--panel:#221a2a;--line:#3a2e45;--text:#ece4f2;--dim:#a294b0;--accent:#ff9a2e;--teal:#5fdcbc}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif}
#app{display:flex;height:100%}#view{flex:1;position:relative;min-width:0}canvas{display:block}
#side{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#side h1{font-size:15px;margin:14px 16px 4px}#side .sub{font-size:12px;color:var(--dim);margin:0 16px 10px}
.row{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
button{background:#2d2337;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
button.on{background:var(--accent);color:#1a0f05;border-color:var(--accent);font-weight:600}
#list{flex:1;overflow:auto;padding:0 10px 12px}
.grp{font-size:11px;color:var(--dim);margin:12px 6px 4px;letter-spacing:.04em}
.item{display:block;width:100%;text-align:left;margin:2px 0;padding:7px 10px}
.item small{display:block;color:var(--dim);font-size:11px;margin-top:2px}.item.on small{color:#3a2208}
#bar{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;background:rgba(34,26,42,.85);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
#bar input[type=range]{flex:1}#time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);min-width:92px;text-align:right}
#title{position:absolute;left:16px;top:14px;font-size:14px;font-weight:600}#title span{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
select{background:#2d2337;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px}
@media (max-width:760px){#app{flex-direction:column}#side{width:100%;height:45%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app"><div id="view"><div id="title">idle<span></span></div>
<div id="bar"><button id="play">일시정지</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.00 / 0.00s</span>
<select id="speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></div></div>
<div id="side"><h1>호박 리퍼 (할로윈 보스)</h1><p class="sub">드래그로 회전 · 휠로 확대 · 바닥 격자 1칸 = 1블록</p>
<div class="row"><button id="b0" class="on">기본</button><button id="b1">이로치</button><button id="glow" class="on">발광</button><button id="dark">어둡게</button></div>
<div id="list"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D=/*DATA*/null;
const DESC={spawn:'등장',idle:'대기',walk:'이동',attack:'1. 수확 베기',death:'사망',
p01_harvest_double:'1. 수확 베기 2연타',p02_crescent_spin:'2. 반달 회전베기',p03_boomerang_throw:'3. 부메랑 낫',p04_pumpkin_bomb:'4. 호박 폭탄',
p05_soul_chain:'5. 영혼 사슬',p06_ground_hands:'6. 땅속의 손',p07_ghost_dash:'7. 유령 돌진',p08_trick_or_treat:'8. 장난칠까 사탕 줄까',
p09_candy_rain_start:'9. 사탕 비 - 시작',p09_candy_rain_loop:'9. 사탕 비 - 공중 대기',p09_candy_rain_end:'9. 사탕 비 - 착지',p10_reaper_leap:'10. 수확자의 도약',
return_vanish:'귀환 - 흩어짐',return_appear:'귀환 - 나타남',guard_loop:'패턴 중 무적 대기',laugh:'웃기',
g1_scythe_plant:'기믹1 거짓말하는 호박들 - 낫 꽂기',g2_split:'기믹2 세 번의 종소리 - 분열',g2_merge_sweep:'기믹2 실패 - 합체 전체 베기',
g3_lantern_drop:'기믹3 마지막 등불 - 등불 떨어뜨리기',g3_arena_sweep:'기믹3 끝 - 경기장 휩쓸기'};
const GROUPS=[['기본',/^(spawn|idle|walk|attack|death)$/],['기본 패턴',/^p\d/],['귀환 · 무적',/^(return|guard|laugh)/],['기믹',/^g\d/]];
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);view.appendChild(renderer.domElement);
const scene=new THREE.Scene();const BG=[new THREE.Color(0x2a2133),new THREE.Color(0x07050a)];scene.background=BG[0];
const cam=new THREE.PerspectiveCamera(40,1,1,2000);cam.position.set(55,45,-80);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.target.set(0,26,0);ctl.update();
const amb=new THREE.AmbientLight(0xffffff,.55);scene.add(amb);const dl=new THREE.DirectionalLight(0xffffff,.75);dl.position.set(40,80,-60);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xb9a6ff,.25);dl2.position.set(-40,30,70);scene.add(dl2);
const grid=new THREE.GridHelper(96,6,0x6b5a7a,0x3a2e45);scene.add(grid);
const tl=new THREE.TextureLoader();const texs=D.tex.map(s=>{const t=tl.load(s);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t;});
const matLit=new THREE.MeshLambertMaterial({map:texs[0],transparent:true,alphaTest:.05,side:THREE.DoubleSide});
const matGlow=new THREE.MeshBasicMaterial({map:texs[0],transparent:true,alphaTest:.05,side:THREE.DoubleSide});
const R=d=>d*Math.PI/180;
function faceGeo(e){
  const inf=e.i,f=e.f.map(v=>v-inf),t=e.t.map(v=>v+inf);const[X0,Y0,Z0]=f,[X1,Y1,Z1]=t;
  const P={north:[[X1,Y1,Z0],[X0,Y1,Z0],[X1,Y0,Z0]],south:[[X0,Y1,Z1],[X1,Y1,Z1],[X0,Y0,Z1]],east:[[X1,Y1,Z1],[X1,Y1,Z0],[X1,Y0,Z1]],
    west:[[X0,Y1,Z0],[X0,Y1,Z1],[X0,Y0,Z0]],up:[[X1,Y1,Z1],[X0,Y1,Z1],[X1,Y1,Z0]],down:[[X1,Y0,Z0],[X0,Y0,Z0],[X1,Y0,Z1]]};
  const pos=[],uv=[];const o=e.o;
  for(const k in e.uv){const u=e.uv[k];if(Math.abs(u[2]-u[0])<1e-6||Math.abs(u[3]-u[1])<1e-6)continue;
    const[c0,cu,cv]=P[k];const c3=[cu[0]+cv[0]-c0[0],cu[1]+cv[1]-c0[1],cu[2]+cv[2]-c0[2]];
    const U=x=>x/D.W,V=y=>1-y/D.H;const q=[[c0,U(u[0]),V(u[1])],[cu,U(u[2]),V(u[1])],[cv,U(u[0]),V(u[3])],[c3,U(u[2]),V(u[3])]];
    for(const i of[0,2,1,1,2,3]){const[p,a,b]=q[i];pos.push(p[0]-o[0],p[1]-o[1],p[2]-o[2]);uv.push(a,b);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();return g;}
const bones={};
function build(g,parentO,parentObj,glow){
  const n=new THREE.Object3D();n.rotation.order='ZYX';n.userData={base:[g.o[0]-parentO[0],g.o[1]-parentO[1],g.o[2]-parentO[2]],rot:g.r};
  n.position.set(...n.userData.base);n.rotation.set(R(g.r[0]),R(g.r[1]),R(g.r[2]));parentObj.add(n);bones[g.n]=n;
  const gl=glow||/glow/.test(g.n);
  for(const c of g.c){if(typeof c==='string'){const e=D.els[c];const p=new THREE.Object3D();p.rotation.order='ZYX';
      p.position.set(e.o[0]-g.o[0],e.o[1]-g.o[1],e.o[2]-g.o[2]);p.rotation.set(R(e.r[0]),R(e.r[1]),R(e.r[2]));
      const m=new THREE.Mesh(faceGeo(e),gl?matGlow:matLit);m.userData.glow=gl;p.add(m);n.add(p);}
    else build(c,g.o,n,gl);}}
const world=new THREE.Object3D();scene.add(world);D.root.forEach(g=>build(g,[0,0,0],world,false));
function sample(keys,t,def){if(!keys)return def;const n=keys.length;if(t<=keys[0][0])return keys[0].slice(1,4);if(t>=keys[n-1][0])return keys[n-1].slice(1,4);
  let i=0;while(i<n-1&&keys[i+1][0]<t)i++;const a=keys[i],b=keys[i+1];const f=(t-a[0])/(b[0]-a[0]||1);
  if(b[4]==='catmullrom'||a[4]==='catmullrom'){const p0=keys[Math.max(0,i-1)],p3=keys[Math.min(n-1,i+2)];
    return [1,2,3].map(k=>{const P0=p0[k],P1=a[k],P2=b[k],P3=p3[k],t2=f*f,t3=t2*f;
      return .5*((2*P1)+(-P0+P2)*f+(2*P0-5*P1+4*P2-P3)*t2+(-P0+3*P1-3*P2+P3)*t3);});}
  return [1,2,3].map(k=>a[k]+(b[k]-a[k])*f);}
let cur=D.anims.find(a=>a.name==='idle'),t=0,playing=true,speed=1;
function pose(){for(const name in bones){const n=bones[name],u=n.userData,tr=cur&&cur.tr[name]||{};
  const r=sample(tr.rotation,t,[0,0,0]),p=sample(tr.position,t,[0,0,0]),s=sample(tr.scale,t,[1,1,1]);
  n.rotation.set(R(u.rot[0]-r[0]),R(u.rot[1]-r[1]),R(u.rot[2]+r[2]));n.position.set(u.base[0]-p[0],u.base[1]+p[1],u.base[2]+p[2]);
  n.scale.set(Math.max(1e-4,s[0]),Math.max(1e-4,s[1]),Math.max(1e-4,s[2]));}}
const list=document.getElementById('list');const items={};
for(const[label,re]of GROUPS){const h=document.createElement('div');h.className='grp';h.textContent=label;list.appendChild(h);
  for(const a of D.anims.filter(a=>re.test(a.name))){const b=document.createElement('button');b.className='item';
    b.innerHTML=`${DESC[a.name]||a.name}<small>${a.name} · ${a.len}s · ${a.loop}</small>`;b.onclick=()=>select(a.name);list.appendChild(b);items[a.name]=b;}}
function select(nm){cur=D.anims.find(a=>a.name===nm);t=0;playing=true;playBtn.textContent='일시정지';
  for(const k in items)items[k].classList.toggle('on',k===nm);document.getElementById('title').innerHTML=`${DESC[nm]||nm}<span>${nm}</span>`;}
const playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),timeEl=document.getElementById('time');
playBtn.onclick=()=>{playing=!playing;if(playing&&cur.loop!=='loop'&&t>=cur.len)t=0;playBtn.textContent=playing?'일시정지':'재생';};
scrub.oninput=()=>{playing=false;playBtn.textContent='재생';t=scrub.value/1000*cur.len;};
document.getElementById('speed').onchange=e=>speed=+e.target.value;
function skin(i){matLit.map=matGlow.map=texs[i];matLit.needsUpdate=matGlow.needsUpdate=true;
  document.getElementById('b0').classList.toggle('on',i===0);document.getElementById('b1').classList.toggle('on',i===1);}
document.getElementById('b0').onclick=()=>skin(0);document.getElementById('b1').onclick=()=>skin(1);
let glowOn=true,dark=false;
document.getElementById('glow').onclick=e=>{glowOn=!glowOn;e.target.classList.toggle('on',glowOn);
  world.traverse(o=>{if(o.isMesh&&o.userData.glow)o.material=glowOn?matGlow:matLit;});};
document.getElementById('dark').onclick=e=>{dark=!dark;e.target.classList.toggle('on',dark);scene.background=BG[dark?1:0];
  amb.intensity=dark?.12:.55;dl.intensity=dark?.15:.75;dl2.intensity=dark?.08:.25;};
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();select('idle');
let last=performance.now();
(function loop(now){const dt=(now-last)/1000;last=now;
  if(playing&&cur){t+=dt*speed;if(t>cur.len){if(cur.loop==='loop')t%=cur.len;else if(t>cur.len+0.8&&cur.loop==='once')t=0;}}
  const tt=Math.min(t,cur.len);const save=t;t=tt;pose();t=save;
  scrub.value=Math.round(tt/cur.len*1000);timeEl.textContent=`${tt.toFixed(2)} / ${cur.len.toFixed(2)}s`;
  renderer.render(scene,cam);requestAnimationFrame(loop);})(last);
</script></body></html>
