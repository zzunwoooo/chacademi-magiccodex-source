# 1인 던전 보스 "재의 그림자" + 같은 던전 잡몹 3종 (2026-11-03). 진행(장치·패턴·50% 탄막·그로기·변신·광폭화)은 애드온 chaash (AshShadowBoss.java).
# 경기장 = 보스 소환 위치 중심 반경 16 (chaash arena=). 장치 3개는 소환 정면 기준 90°·210°·330°, 중심에서 반경 9 (arena × 0.56).
#
# 체력 설계 (사장님 2026-11-03: "지능 140 유저가 그로기 때 극딜하면 20% 남게"):
#   지능(마력) 140 기준 마법 한 방 = base + 비율 × 140 → 중앙값 약 60, 궁극기 약 300 (server-config/spell-runtime.yml).
#   그로기 10초 극딜 ≈ 궁극기 2 + 일반 4~5발 + 짧은 쿨 반복 ≈ 1200 → 최대 체력의 30% (50% → 20%) 이 되게 Health 4000.
#   20% 이하는 처형 마법 구간. 실제 딜이 다르면 Health 만 바꾸면 된다 (나머지는 비율).
# 공격력: 패턴 피해는 애드온 안의 값 × 장치 배율(3개 2.0 / 2개 1.7 / 1개 1.4 / 0개 1.0), 광폭화 흡수 배율(0 1.5 / 1 1.7 / 2 1.9 / 3 2.2).
#   아래 Damage(근접)도 같은 배율이 붙는다 (AshShadowBoss.Hooks.melee). 탄막은 맞으면 최대 체력 55% (2번 = 죽음).
# 모델: ModelEngine ash_shadow / ash_shadow_enraged (models/ash_shadow/*.bbmodel). 변신 때 CHA_ASH_swap 으로 교체.

CA_Boss_ash_shadow:
  Type: HUSK
  Display: '&8&l재의 그림자'
  Health: 4000
  Damage: 22
  Armor: 0
  BossBar:
    Enabled: true
    Title: '&8&l재의 그림자'
    Range: 40
    Color: WHITE
    Style: SEGMENTED_10
    CreateFog: true
    DarkenSky: true
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    PreventRenaming: true
    Silent: true
    FollowRange: 40
    MovementSpeed: 0.27
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
  Drops: []
  Skills:
  - model{mid=ash_shadow;n=false;drive=true} @self ~onSpawn
  - addtag{t=chacademia_custom} @self ~onSpawn
  - chaash{a=start;arena=16} @self ~onSpawn
  - state{s=attack;li=0;lo=2} @self ~onAttack
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  AITargetSelectors:
  - clear
  - players
  - hurtbytarget

# 빛 발산 장치 (애드온이 소환·파괴). 던전 기믹 모델 gm_light_receiver(빛 수신 수정) 재사용. 직접 때려서는 안 부서짐 (보스 유도 패턴으로만).
CA_Ash_light_device:
  Type: HUSK
  Display: '&e빛 발산 장치'
  Health: 1000
  Options:
    NoAI: true
    PreventOtherDrops: true
