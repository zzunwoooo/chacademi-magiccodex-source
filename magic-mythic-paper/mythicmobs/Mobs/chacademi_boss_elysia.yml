# 1인 레이드 "자비의 천사 엘리시아 → 가면의 악마 벨자르" + 기믹 소품 + 잡몹 (2026-11-09). 진행은 애드온 chaelysia (ElysiaBoss.java).
# 경기장 = 엘리시아 소환 위치 중심 반경 16 (chaelysia arena=). 소환 때 바라본 방향 = 정면 (석상·석주·봉인진 배치 기준).
# 50%에서 애드온이 엘리시아를 지우고 같은 자리에 CA_Boss_belzar 를 소환해 진행을 이어 간다 (체력 50%, 빚 그대로).
# 벨자르·소품·잡몹은 애드온이 직접 소환한다 (손으로 소환하면 진행 없이 몸만 나옴).
#
# 체력 설계 (1인): 재의 그림자(4000, 그로기 포함)보다 기믹이 많고 그로기가 없어 6000.
#   100→50% 엘리시아 3000 + 50→15% 벨자르 2100. 지능 140 1분 딜 약 1500 → 딜 구간 약 3.5분 + 기믹 9개 → 전투 약 7~8분.
#   실제 딜이 다르면 두 몹의 Health 를 같이 바꾸면 된다 (기준선은 비율, 벨자르는 최대 체력의 50%로 시작).
# 공격력: 패턴 피해는 애드온 안의 값 (22~28, 원소 light/dark). 수금 = 최대 체력 18%, 사슬 이탈 3%/초, 무너지는 바깥 5%/0.5초. 기믹 실패 = 즉사.
# 모델: ModelEngine (models/elysia/). _shiny 보스 모델은 지금 안 씀.

CA_Boss_elysia:
  Type: HUSK
  Display: '&e&l엘리시아'
  Health: 6000
  Damage: 18
  Armor: 0
  BossBar:
    Enabled: true
    Title: '&e&l엘리시아'
    Range: 48
    Color: YELLOW
    Style: SEGMENTED_10
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    PreventRenaming: true
    Silent: true
    FollowRange: 40
    MovementSpeed: 0.24
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
  Drops: []
  Skills:
  - addtag{t=chacademia_boss} @self ~onSpawn   # 11/09 크로스 애로우 처형·보스 체력바 (보스·기믹 소품)
  - model{mid=elysia;n=false;drive=true} @self ~onSpawn
  - addtag{t=chacademia_custom} @self ~onSpawn
  - chaelysia{a=start;arena=16} @self ~onSpawn
  - skill{s=CHA_EL_a_attack} @self ~onAttack
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  AITargetSelectors:
  - clear
  - players
  - hurtbytarget

