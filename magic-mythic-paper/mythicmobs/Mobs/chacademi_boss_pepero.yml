# 빼빼로데이 이벤트 3인 던전 「초코 막대 공방」 (2026-11-11) — 보스 외톨이 마녀 쇼콜라 + 공방 일꾼 + 기믹 소품
# 진행은 전부 이 yml 과 Skills/chacademi_boss_pepero.yml (애드온 코드 없음). 피해는 chatelegraph (던전 이지 배율이 그대로 먹음).
# 모델: models/pepero_day/*.bbmodel → ModelEngine blueprints. VFX: PepChocola (공격) · PepSweet (기믹·연출).
# 체력 % 조건(healthpercent)이라 던전 이지 체력 배율과 상관없이 70%·60%·40%·15% 에서 기믹이 나온다.
# 변수: phase 1→2 (60%) · busy 패턴 중 · gim 기믹 중 · g1 g2 g3 한 번씩 · enr 광폭(15%) · shield 껍질 · boxes 부순 상자 수 · w 이로치(흰 VFX)

CA_Boss_pep_chocola:
  Type: HUSK
  Display: '&d&l외톨이 마녀 &f&l쇼콜라'
  Health: 8000
  Damage: 0            # 피해는 전부 스킬(chatelegraph). 기본 근접은 이동용
  Armor: 10
  BossBar:
    Enabled: true
    Title: '&d&l외톨이 마녀 쇼콜라'
    Range: 48
    Color: PINK
    Style: SEGMENTED_10
    CreateFog: false
    DarkenSky: false
  Faction: pepero
  Options:
    MovementSpeed: 0.27
    FollowRange: 40
    KnockbackResistance: 1
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventSunburn: true
    PreventTransformation: true
    PreventRenaming: true
    Silent: true
    Despawn: false
    Collidable: true
    AlwaysShowName: false
    MaxCombatDistance: 40
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - clear
  - float
  - meleeattack
  - randomstroll
  AITargetSelectors:
  - clear
  - players
  - attacker
  Equipment: []
  Variables:
    phase: 1
    busy: 0
    gim: 0
    g1: 0
    g2: 0
    g3: 0
    enr: 0
    shield: 0
    boxes: 0
    w: 0
  Skills:
  - addtag{t=chacademia_boss} @self ~onSpawn   # 크로스 애로우 처형 막기 + 보스 체력바
  - addtag{t=chacademia_custom} @self ~onSpawn
  - model{mid=pep_chocola;hb=true;n=false} @self ~onSpawn
  - skill{s=PEP_BOSS_SPAWN} @self ~onSpawn
  - skill{s=PEP_BOSS_HURT} @self ~onDamaged
  - skill{s=PEP_SHIELD_BLOCK;sync=true} @self ~onDamaged ?variableequals{var=caster.shield;value=1}
  # --- 2페이즈 (60%) · 기믹 (70 / 40 / 15%) — 기믹끼리는 겹치지 않게 gim=0 일 때만
  - skill{s=PEP_PHASE2} @self ~onDamaged ?healthpercent{p=<0.6} ?variableequals{var=caster.phase;value=1}
  - skill{s=PEP_G1} @self ~onDamaged ?healthpercent{p=<0.7} ?variableequals{var=caster.g1;value=0} ?variableequals{var=caster.gim;value=0}
  - skill{s=PEP_G2} @self ~onDamaged ?healthpercent{p=<0.4} ?variableequals{var=caster.g2;value=0} ?variableequals{var=caster.gim;value=0}
  - skill{s=PEP_G3} @self ~onDamaged ?healthpercent{p=<0.15} ?variableequals{var=caster.g3;value=0} ?variableequals{var=caster.gim;value=0}
  - skill{s=PEP_BOX_SIGNAL} @self ~onSignal:PEP_BOX
  # --- 2페이즈: 빼빼로 게임 30초마다
  - skill{s=PEP_G1_REPEAT} @self ~onTimer:600 ?variableequals{var=caster.phase;value=2} ?variableequals{var=caster.gim;value=0}
  # --- 패턴 고르기: 2초마다 (광폭 1.5초)
  - skill{s=PEP_AI} @target ~onTimer:40 ?variableequals{var=caster.enr;value=0} ?targetwithin{d=30}
  - skill{s=PEP_AI} @target ~onTimer:30 ?variableequals{var=caster.enr;value=1} ?targetwithin{d=30}
  - skill{s=PEP_BASIC} @target ~onTimer:30 ?targetwithin{d=3}
  - skill{s=PEP_BOSS_DEATH} @self ~onDeath
  Drops: []

