# 1인 레이드 "도박의 악마 룰레타" + 기믹 소품 + 잡몹 3종 (2026-11-09). 기획서: Claude Docs "차카데미 악마 1인 레이드 5종 기획서" 3번.
# 경기장 = 룰레타 소환 위치 중심 반경 18 (가운데 딜러 테이블 반경 4). 바닥 6색 부채꼴 구역(60°씩)은 맵에 직접 깐다.
# 진행(룰렛 기믹·짤패턴·50% 하우스 룰·30% 광폭화)은 애드온 charoulette (RouletteBoss.java). 소환 위치 = 경기장 중심, 바라보는 방향 = 0번 구역.
#   애드온이 없으면 이 몹은 근접 공격만 하는 몸으로 나온다. 패턴 → 모션 스킬 → VFX 대응표는 Skills 파일 머리말.
# 소품(주사위·칩 탑·동전)은 애드온이 직접 소환·제거한다 (무적, 피해 없음).
#
# 체력 설계 (1인): 기획 3800. 룰렛 적중 1회 = 최대 체력 6% 고정 피해(애드온) + 4초 그로기.
#   지능 140 1분 딜 약 1500 → 딜 구간 약 2분 + 룰렛 약 6회(적중 시 약 36%) + 하우스 룰 그로기 → 전투 약 5~6분.
#   20% 즉사기 전에 30% 광폭화를 한 번은 보게 된다. 실제 딜이 다르면 Health 하나만 바꾸면 된다.
# 공격력: 짤패턴 피해는 애드온 안의 값(18~32). 룰렛 틀림 = 최대 체력 45% (테이블 30%, 하우스 룰 35%).
# 모델: ModelEngine roulette (등 뒤 룰렛 바늘은 needle 본, needle_stop_0~5 / needle_trick_0~5 상태로 멈출 구역을 정함).

CA_Boss_roulette:
  Type: HUSK
  Display: '&6&l룰레타'
  Health: 5625
  Damage: 20
  Armor: 0
  BossBar:
    Enabled: true
    Title: '&6&l룰레타'
    Range: 48
    Color: YELLOW
    Style: SEGMENTED_10
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    PreventRenaming: true
    Silent: true
    FollowRange: 40
    MovementSpeed: 0.22
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
  Drops: []
  Skills:
  - addtag{t=chacademia_boss} @self ~onSpawn   # 11/09 크로스 애로우 처형·보스 체력바 (보스·기믹 소품)
  - model{mid=roulette;n=false;drive=true} @self ~onSpawn
  - addtag{t=chacademia_custom} @self ~onSpawn
  - charoulette{a=start;arena=18;table=4} @self ~onSpawn
  - skill{s=CHA_RL_a_attack} @self ~onAttack
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  AITargetSelectors:
  - clear
  - players
  - hurtbytarget

