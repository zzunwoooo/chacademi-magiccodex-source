# 3인 공성전 레이드 "100년 전, 성문 방어전" (2026-11-13) — 성문 · 보스 4 (봉인 전 3천왕 + 해방된 악마) · 네발 마수 8종(+이로치).
# 진행(마수 물결 · 포탈 · 보스 등장 · 짤패턴 · 성문 체력 · 승패)은 애드온 chasiege (SiegeRaid.java).
#   /mm mobs spawn CA_Siege_gate — 소환한 자리 = 성문, 바라본 방향 = 적이 오는 쪽. 포탈은 그 방향 40칸 앞에 좌우 12칸 간격으로 3개.
#   애드온이 없으면 보스·마수는 아래 미몹 스킬만으로 싸우는 몸으로 나온다 (성문·물결 없음).
# 기믹 없음. 보스는 짤패턴만 (보스마다 9~10개, 체력 30% 아래 광폭화 뒤 1개 추가). 패턴 수치는 애드온 안, 대응표는 Skills 파일 머리말.
#
# 체력 (3인 기준, 지능 140 1분 딜 약 1500 × 3): 솜니아 9000 · 룰레타 10000 · 벨자르 11000 · 악마 16000 → 보스당 3~4분, 전체 약 15~18분.
#   마수는 한두 번의 광역기에 쓰러지는 약한 몸(260~700), 공성 거수만 2600. 성문 체력은 CA_Siege_gate 의 gatehp (기본 4000).
# 모델(ModelEngine): somnia_past · roulette_past · belzar_past · freed_demon_past · siege_<마수>[_shiny]. belzar_past 는 작게 만들어져 있어 1.8배 권장.

# 성문 (보이지 않는 진행용 몸). 체력은 애드온이 따로 관리하고 화면 위 막대로 보여 준다.
CA_Siege_gate:
  Type: HUSK
  Display: '&c성문'
  Health: 1000
  Options:
    NoAI: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    Silent: true
    Collidable: false
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
    Invincible: true
  Drops: []
  Skills:
  - potion{type=INVISIBILITY;duration=999999;level=1;force=true;hasParticles=false} @self ~onSpawn
  - chasiege{a=start;lane=40;gatehp=4000} @self ~onSpawn

# 연출용 표식 (꿈방울이 붙는 보이지 않는 몸). 애드온이 소환·제거.
CA_Siege_marker:
  Type: HUSK
  Display: '&7표식'
  Health: 1000
  Options:
    NoAI: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    Silent: true
    Collidable: false
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
    NoGravity: true
  Drops: []
  Skills:
  - potion{type=INVISIBILITY;duration=999999;level=1;force=true;hasParticles=false} @self ~onSpawn

