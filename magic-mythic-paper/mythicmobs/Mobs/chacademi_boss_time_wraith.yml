# 3인 고난도 보스 "시간의 망령" + 기믹 소품 (2026-11-03). 진행(패턴·기믹 3종·가짜 클리어·2페이즈)은 애드온 chatime (TimeWraithBoss.java).
# 경기장 = 보스 소환 위치 중심 반경 18 (chatime arena=). 소환 때 보스가 바라본 방향 = 경기장 정면 = 바닥 시계 12시.
#
# 체력 설계 (3인 고난도): 지능(마력) 140 기준 마법 한 방 중앙값 약 60, 궁극기 약 300 (server-config/spell-runtime.yml).
#   3인 × 1분에 약 4000~5000 → 1페이즈 100→0% 약 3~4분 + 기믹 3개 + 2페이즈(50%까지 차오른 뒤 처치) → Health 18000.
#   기믹1 시간 감옥 체력 = 갇힌 사람 누적 딜 × 1.0 (TimeWraithBoss.PRISON_RATIO) → 75% 시점 1등 딜 약 1600~2200, 둘이 20초 안에 깨는 수준.
#   실제 딜이 다르면 Health 하나만 바꾸면 된다 (나머지는 비율).
# 공격력: 패턴 피해는 애드온 안의 값 (18~32, 2페이즈 ×1.2). 멈춘 세계 탄 = 최대 체력 45% (두 발 = 죽음, 방패는 피해 없음).
# 모델: ModelEngine time_wraith (models/time_wraith/*.bbmodel). _shiny 는 지금 안 씀.

CA_Boss_time_wraith:
  Type: HUSK
  Display: '&3&l시간의 망령'
  Health: 18000
  Damage: 26
  Armor: 0
  BossBar:
    Enabled: true
    Title: '&3&l시간의 망령'
    Range: 48
    Color: BLUE
    Style: SEGMENTED_12
    CreateFog: true
    DarkenSky: false
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    PreventRenaming: true
    Silent: true
    FollowRange: 44
    MovementSpeed: 0.26
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
  Drops: []
  Skills:
  - model{mid=time_wraith;n=false;drive=true} @self ~onSpawn
  - addtag{t=chacademia_custom} @self ~onSpawn
  - chatime{a=start;arena=18} @self ~onSpawn
  - state{s=attack;li=0;lo=2} @self ~onAttack
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  AITargetSelectors:
  - clear
  - players
  - hurtbytarget

# ======================================================================== 기믹 소품 (애드온이 소환·제거, 스스로 움직이지 않음)

