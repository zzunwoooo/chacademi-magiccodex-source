# 1인 레이드 "몽마 솜니아" + 기믹 소품 + 잡몹 3종 (2026-11-09). 기획서: Claude Docs "차카데미 악마 1인 레이드 5종 기획서" 4번.
# 현실 = 무너진 탑 침실 반경 16 / 꿈 = 같은 구조를 다른 좌표에 복제한 맵 (가장자리 종탑 4곳). 두 맵은 직접 짓는다.
# 진행(꿈·현실 전환, 졸음 게이지, 잠의 웅덩이, 종, 50% 깨지 않는 꿈, 30% 경계 붕괴)은 애드온 chasomnia (SomniaBoss.java). 꿈 맵 = 소환 위치 + (dx,dy,dz), 현실 경기장과 같은 구조로 지어 둘 것.
#   애드온이 없으면 이 몹은 근접 공격만 하는 몸으로 나온다. 패턴 → 모션 스킬 → VFX 대응표는 Skills 파일 머리말.
# 현실 쪽 몸은 반투명 모델 somnia_veil (받는 피해 20%는 애드온), 꿈 쪽 몸은 실체 모델 somnia (CA_Boss_somnia_dream, 체력은 애드온이 현실 몸과 맞춤).
#
# 체력 설계 (1인): 기획 4400. 꿈 딜은 15초 단위로 끊기고 현실 딜은 20%라 체력을 높게 잡음.
#   지능 140 1분 딜 약 1500 기준 꿈 딜 비율 약 60% → 딜 구간 약 4분 + 50% 그로기 10초 → 전투 약 6~7분.
#   실제 딜이 다르면 두 몸의 Health 를 같이 바꾸면 된다.
# 공격력: 짤패턴 피해는 애드온 안의 값(16~34). 졸음 가득 = 즉사. 자장가 = 졸음 +30%.
# 모델: ModelEngine somnia / somnia_veil (모양·모션 같음, 텍스처만 반투명).

CA_Boss_somnia:
  Type: HUSK
  Display: '&d&l솜니아'
  Health: 4000
  Damage: 18
  Armor: 0
  BossBar:
    Enabled: true
    Title: '&d&l솜니아'
    Range: 48
    Color: PURPLE
    Style: SEGMENTED_10
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    PreventRenaming: true
    Silent: true
    FollowRange: 40
    MovementSpeed: 0.24
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
  Drops: []
  Skills:
  - addtag{t=chacademia_boss} @self ~onSpawn   # 11/09 크로스 애로우 처형·보스 체력바 (보스·기믹 소품)
  - model{mid=somnia_veil;n=false;drive=true} @self ~onSpawn
  - addtag{t=chacademia_custom} @self ~onSpawn
  - chasomnia{a=start;arena=16;dx=0;dy=0;dz=120} @self ~onSpawn
  - skill{s=CHA_SN_a_attack} @self ~onAttack
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  AITargetSelectors:
  - clear
  - players
  - hurtbytarget

