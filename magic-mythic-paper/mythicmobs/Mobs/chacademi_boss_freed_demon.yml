# 1인 레이드 "해방된 악마" + 기믹 소품 + 잡몹 (2026-11-09). 진행은 애드온 chafreed (FreedDemonBoss.java).
# 경기장 = 보스 소환 위치(중앙 제단) 중심 반경 14 (chafreed arena=). 소환 때 바라본 방향 = 정면 (석상 6개·서명 8구역 배치 기준).
# 소품·잡몹은 애드온이 직접 소환한다 (손으로 소환하면 진행 없이 몸만 나옴).
#
# 체력 설계 (1인): 엘리시아(6000, 기믹 9개)보다 기믹은 4개로 적고 짤패턴이 18종이라 딜 구간이 길다 → 7000.
#   지능 140 1분 딜 약 1500 → 딜 구간 약 4.5분 + 기믹 4개(각 20~40초) → 전투 약 7~8분.
#   기준선 70 / 40 / 10 / 1% (비율이라 Health 만 바꾸면 된다). 1% 가짜 사망 뒤 그림자를 놓치면 15% 로 부활.
# 공격력: 패턴 피해는 애드온 안의 값 (14~32, 원소 fire) + 비율 피해 (낙인 45%·가짜 안전지대 60%·반격 40%·불벽 6%/0.5초).
#   기믹 실패 = 즉사 (줄넘기는 50% + 낙인, 낙인 2 = 즉사). 실패한 사람에게만 짧은 단서 한 줄 (규칙 설명 타이틀 없음).
# 모델: ModelEngine (models/freed_demon/). 거짓말 = 보라 눈 (본 eyes_lie, 평소 숨김). _shiny 보스 모델은 지금 안 씀.

CA_Boss_freed_demon:
  Type: HUSK
  Display: '&4&l해방된 악마'
  Health: 7000
  Damage: 20
  Armor: 0
  BossBar:
    Enabled: true
    Title: '&4&l해방된 악마'
    Range: 48
    Color: RED
    Style: SEGMENTED_10
    CreateFog: true
    DarkenSky: true
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
    PreventItemPickup: true
    PreventRenaming: true
    Silent: true
    FollowRange: 40
    MovementSpeed: 0.25
    KnockbackResistance: 1
    AlwaysShowName: false
    Despawn: false
  Drops: []
  Skills:
  - addtag{t=chacademia_boss} @self ~onSpawn   # 11/09 크로스 애로우 처형·보스 체력바 (보스·기믹 소품)
  - model{mid=freed_demon;n=false;drive=true} @self ~onSpawn
  - skill{s=CHA_FD_lie_off} @self ~onSpawn
  - addtag{t=chacademia_custom} @self ~onSpawn
  - chafreed{a=start;arena=14} @self ~onSpawn
  - skill{s=CHA_FD_a_attack} @self ~onAttack
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  AITargetSelectors:
  - clear
  - players
  - hurtbytarget

