# ================================================================ 지옥견 — 근접·도약
# 물기 (0.45초)
CHA_SGB_hound_bite:
  Cooldown: 2.5
  Conditions:
  - targetwithin{d=4.5} true
  Skills:
  - state{s=attack;li=0;lo=3} @self
  - chavfx{id=siege_beasts/hound_bite;at=caster;ticks=24}
  - chatelegraph{shape=cone;at=caster;r=4.5;angle=90;ticks=9;warn=false;flat=12;element=fire;spell=mob_sg_hound_bite} @target

# 도약 물어뜯기: 0.25초에 뛰어 0.6초에 물고 머리를 흔든다 (대상 자리 원 r3)
CHA_SGB_hound_lunge:
  Cooldown: 9
  Conditions:
  - targetwithin{d=16} true
  - targetwithin{d=5} false
  Skills:
  - state{s=lunge_bite;li=0;lo=3} @self
  - chavfx{id=siege_beasts/hound_lunge;at=target;ticks=34}
  - chatelegraph{shape=circle;at=target;r=3;ticks=12;flat=18;element=fire;spell=mob_sg_hound_lunge} @target
  - delay 5
  - lunge{velocity=1.5;velocityY=0.35} @target

# 무리 울음: 12칸 안 지옥견·쌍두 마견·추적자가 8초 동안 빨라지고 세진다
CHA_SGB_hound_howl:
  Cooldown: 30
  Conditions:
  - targetwithin{d=24} true
  Skills:
  - state{s=howl;li=0;lo=3} @self
  - chavfx{id=siege_beasts/hound_howl;at=caster;ticks=50}
  - delay 12
  - potion{type=SPEED;duration=160;level=1} @MobsInRadius{r=12;types=CA_Siege_hound,CA_Siege_hound_shiny,CA_Siege_twin,CA_Siege_twin_shiny,CA_Siege_stalker,CA_Siege_stalker_shiny}
  - potion{type=STRENGTH;duration=160;level=0} @MobsInRadius{r=12;types=CA_Siege_hound,CA_Siege_hound_shiny,CA_Siege_twin,CA_Siege_twin_shiny,CA_Siege_stalker,CA_Siege_stalker_shiny}

# 성문 물어뜯기 (애드온)
CHA_SGB_hound_gate:
  Skills:
  - state{s=attack;li=0;lo=3} @self
  - chavfx{id=siege_beasts/hound_bite;at=caster;ticks=24}

# ================================================================ 뿔 돌격수 — 근접·돌진 (성문 직행)
# 뿔 치켜올리기 (0.55초, 띄움)
CHA_SGB_ram_toss:
  Cooldown: 3
  Conditions:
  - targetwithin{d=5} true
  Skills:
  - state{s=attack;li=0;lo=3} @self
  - chavfx{id=siege_beasts/ram_toss;at=caster;ticks=30}
  - chatelegraph{shape=cone;at=caster;r=5.5;angle=70;ticks=11;flat=18;element=earth;up=0.9;spell=mob_sg_ram_toss} @target

# 직선 돌진: 1초 땅을 긁고 → 0.5초 질주(불길 자국) → 충돌 (직선 16 × 3.5)
CHA_SGB_ram_charge:
  Cooldown: 12
  Conditions:
  - targetwithin{d=20} true
