# 공성전 레이드 보스 모션 + 마수 스킬 (2026-11-13).
# 보스 짤패턴(예고·판정·VFX·대상)은 애드온 chasiege (SiegeRaid.java) 안. 보스는 ModelEngine 상태 재생만: CHA_SG_<SO|RL|BZ|FD>_a_<모션>.
# 마수는 여기 스킬로 스스로 싸운다: 모션(state) + VFX(chavfx, 팩 Siege_Beasts = claude:siege_beasts/<시스템>) + 빨간 예고·판정(chatelegraph).
#   VFX 는 마수 발밑·정면 기준으로 만들어져 있어 모션과 같은 순간에 재생하면 타격 시점이 맞는다. 포탈 등장은 CHA_SGB_portal_out.
#   성문에 붙었을 때는 애드온이 CHA_SGB_<마수>_gate 를 2초마다 시전하고 성문 체력을 깎는다.
#
# 애드온 보스 패턴 대응표 (/테스트 보스 공성전 패턴 <id>)   모션 / VFX 시스템 / 범위
#   [솜니아 claude:siege_somnia]  orb 꿈방울 orb_summon / dream_orb(따라감) → dream_orb_pop r2.5 · gaze 돌아가는 시선 gaze_sweep / 광선 3개 26×1.6 5초 회전
#     lullaby 자장가 물결 lullaby_wave ×3 / 고리 2→18 뛰어넘기 · echo 악몽의 잔상 echo_cast / nightmare_echo r2 ×10 · yawn 하품 / yawn_pull → yawn_burst r7
#     fog 잠의 안개 fog_cast / sleep_fog r4.6 8초 ×3 · eyelid 눈꺼풀 / eyelid_band 36×6 ×6 · fullmoon(광폭화) 만월 낙하 full_moon r8
#   [룰레타 claude:siege_roulette]  cards 카드 부메랑 card_boomerang / card_out → card_back 18×1.5 ×5 · dice 튕기는 주사위 dice_roll / dice_hop ×3 → dice_pop_s|m|l
#     domino 칩 도미노 chip_domino 20×3 ×2 · coin 동전 coin_flip / coin_toss → coin_heads_in r8 | coin_tails_out 8~16 · slot 슬롯 slot_pull / slot_lane 40×4 ×3
#     sectors 룰렛 난사 call_bets / sector_red·gold·violet 60° r16 · hands 여섯 손 six_hands / hand_slam r2.5 ×6 · allin 올인 all_in 180° r12 · jackpot(광폭화) r2.5 ×24
#   [벨자르 claude:siege_belzar]  debt 청구서 debt_mark(따라감) → debt_due r4 · invert 흑백 반전 invert_white_first|invert_black_first / white_in·black_out | white_out·black_in
#     chain 사슬 포박 chain_pull / debt_chain 24×2 → claw 100° r5 · mines 깃털 지뢰 feather_scatter → black_wave / feather_mine → mine_burst r3.5 ×5
#     halo 좁혀드는 후광 halo_close 18→1 뛰어넘기 · mirror 거울 일격 mirror_strike / mirror_white + mirror_black 20×5 · spears 행진하는 창 spear_march / spear_step r2 ×8
#     interest 복리 interest_1~3 r3→5.5→8 · final(광폭화) 최후 청구 final_claim / final_white → final_black 12×12 체스판
#   [악마 claude:siege_demon]  combo 대검 3연격 swing_r → swing_l → cleave · leap 도약 강타 leap / leap_crater r6 → leap_wave 6→24 · dash 지옥 돌진 dash 32×6 → dash_fire 5초
#     throw 마검 투척 sword_throw r7 → sword_recall · fissure 지면 가르기 fissure / fissure_run 28×3 ×3 · breath 숨결 breath / breath_seg 30° r16 ×7
#     pillars 추적 불기둥 pillar_cast / hell_pillar r2.5 ×6 · wings 강풍 wing_gust / wing_storm 160° r18 · roar 포효 / roar_wave 2→28 ×3 · doom(광폭화) doom_half 18×48 ×2
#   [공통] gate 성문 강타 gate_strike / gate_strike 24×5(악마 6) — 성문 체력 5% (악마 8%) · 광폭화 enrage / enrage

