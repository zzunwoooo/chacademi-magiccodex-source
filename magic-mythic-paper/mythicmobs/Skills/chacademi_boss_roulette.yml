# ---------------- 잡몹 (VFX 팩 Roulette_Mobs = claude:roulette_mobs/<시스템>)

# 칩 임프 - 굴러 들이받기: 몸 앞 부채꼴 반경 2 · 90°, 체술이라 예고 없음 (모션 0.7초에 판정). 피해 12.
CHA_MOB_rl_imp_roll:
  Cooldown: 2
  Conditions:
  - targetwithin{d=3} true
  Skills:
  - state{s=attack;li=0;lo=2} @self
  - chatelegraph{shape=cone;at=caster;r=2;angle=90;ticks=14;warn=false;flat=12;element=fire;vfx=roulette_mobs/imp_hit;vfxref=2;vfxlead=0;spell=mob_rl_imp_roll} @target

# 칩 임프 - 사망 동전 폭발: 자기 중심 원 반경 2, 예고 0.4초 (죽어도 취소 안 됨). 피해 8.
CHA_MOB_rl_imp_pop:
  Skills:
  - chatelegraph{shape=circle;at=caster;r=2;ticks=8;flat=8;element=fire;cancel=false;vfx=roulette_mobs/imp_pop;vfxref=2;vfxlead=2;spell=mob_rl_imp_pop} @self

# 카드 병정 - 3연 베기: 몸 앞 부채꼴 반경 4 · 120°, 0.35 / 0.8 / 1.25초에 판정 (오른→왼, 왼→오른, 내려베기). 각 18.
CHA_MOB_rl_soldier_slash:
  Cooldown: 5
  Conditions:
  - targetwithin{d=5} true
  Skills:
  - state{s=attack;li=0;lo=3} @self
  - chatelegraph{shape=cone;at=caster;r=4;angle=120;ticks=7;flat=18;element=dark;vfx=roulette_mobs/slash_a;vfxref=4;vfxlead=0;spell=mob_rl_soldier_slash} @target
  - delay 7
  - chatelegraph{shape=cone;at=caster;r=4;angle=120;ticks=9;flat=18;element=dark;vfx=roulette_mobs/slash_b;vfxref=4;vfxlead=0;spell=mob_rl_soldier_slash} @target
  - delay 9
  - chatelegraph{shape=cone;at=caster;r=4;angle=120;ticks=9;flat=18;element=dark;knock=0.6;vfx=roulette_mobs/slash_c;vfxref=4;vfxlead=0;spell=mob_rl_soldier_slash} @target

# 주사위 술사 - 주사위 투척: 대상 발밑 원 반경 2.5, 예고 1.2초. 0.75초에 던짐 (투사체는 보여주기, 판정은 예고 원). 피해 = 눈 × 6 (무작위 1~6).
CHA_MOB_rl_mage_dice:
  Cooldown: 4
  Conditions:
  - targetwithin{d=22} true
  Skills:
  - state{s=attack;li=0;lo=3} @self
  - randomskill{s=CHA_MOB_rl_mage_dice_1,CHA_MOB_rl_mage_dice_2,CHA_MOB_rl_mage_dice_3,CHA_MOB_rl_mage_dice_4,CHA_MOB_rl_mage_dice_5,CHA_MOB_rl_mage_dice_6} @target
  - delay 15
  - chamobshot{flat=0;radius=0.2;speed=0.7;rise=0.35;range=26;fromy=1.8;fromz=0.4;vfx=roulette_mobs/dice} @target
CHA_MOB_rl_mage_dice_1:
  Skills:
  - chatelegraph{shape=circle;at=target;r=2.5;ticks=24;flat=6;element=dark;vfx=roulette_mobs/dice_hit;vfxref=2.5;vfxlead=2;spell=mob_rl_mage_dice} @target
CHA_MOB_rl_mage_dice_2:
