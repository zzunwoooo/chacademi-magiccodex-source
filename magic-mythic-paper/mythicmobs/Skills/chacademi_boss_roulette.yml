# 반복: 룰렛 돌리기 / 그로기 (다음 모션 전에 CHA_RL_clear)
CHA_RL_a_spin_cast:
  Skills:
  - skill{s=CHA_RL_clear} @self
  - state{s=spin_cast;li=0;lo=3} @self
CHA_RL_a_groggy:
  Skills:
  - skill{s=CHA_RL_clear} @self
  - state{s=groggy;li=0;lo=3} @self
# 바늘 (needle 본만 움직임 — 몸 모션과 같이 재생된다). fast = 계속 빠르게, stop_k = 6초 감속 후 구역 k(정면에서 볼 때 맨 위부터 시계방향 0~5)에 멈춤,
# trick_k = 한 칸 앞에서 멈춘 척하다 6.5초에 k 로 넘어감. 멈춘 자세는 다음 needle 상태 전까지 유지.
CHA_RL_needle_clear:
  Skills:
  - state{s=needle_stop_0;r=true} @self
  - state{s=needle_trick_0;r=true} @self
  - state{s=needle_stop_1;r=true} @self
  - state{s=needle_trick_1;r=true} @self
  - state{s=needle_stop_2;r=true} @self
  - state{s=needle_trick_2;r=true} @self
  - state{s=needle_stop_3;r=true} @self
  - state{s=needle_trick_3;r=true} @self
  - state{s=needle_stop_4;r=true} @self
  - state{s=needle_trick_4;r=true} @self
  - state{s=needle_stop_5;r=true} @self
  - state{s=needle_trick_5;r=true} @self
  - state{s=needle_fast;r=true} @self
CHA_RL_needle_fast:
