  - chatelegraph{shape=circle;at=target;r=2.5;ticks=24;flat=12;element=dark;vfx=roulette_mobs/dice_hit;vfxref=2.5;vfxlead=2;spell=mob_rl_mage_dice} @target
CHA_MOB_rl_mage_dice_3:
  Skills:
  - chatelegraph{shape=circle;at=target;r=2.5;ticks=24;flat=18;element=dark;vfx=roulette_mobs/dice_hit;vfxref=2.5;vfxlead=2;spell=mob_rl_mage_dice} @target
CHA_MOB_rl_mage_dice_4:
  Skills:
  - chatelegraph{shape=circle;at=target;r=2.5;ticks=24;flat=24;element=dark;vfx=roulette_mobs/dice_hit;vfxref=2.5;vfxlead=2;spell=mob_rl_mage_dice} @target
CHA_MOB_rl_mage_dice_5:
