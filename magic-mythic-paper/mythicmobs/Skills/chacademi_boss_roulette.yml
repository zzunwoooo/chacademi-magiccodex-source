# 룰레타 보스 모션 + 기믹 소품 모션 + 잡몹 스킬 (2026-11-09).
# 패턴·기믹(예고·판정·VFX·대상)은 애드온 charoulette (RouletteBoss.java) 안. 보스·소품은 ModelEngine 상태 재생만.
# 애드온이 CHA_RL_a_<모션> 을 보스에게, CHA_RL_p_<무엇> 을 소품에게 시전. 반복 모션(spin_cast·groggy)은 CHA_RL_clear 로 지운다.
# idle·walk·death 는 ModelEngine 기본.
#
# 애드온용 패턴 대응표 (모션 스킬 / VFX 팩 Roulette_Boss = claude:roulette_boss/<시스템> / 예고 모양·수치는 기획서 3번):
#   룰렛 (35초마다)      CHA_RL_a_spin_cast + spin(attached 반복) → 속임수 회차면 trick → 6초 뒤 needle_stop_k 또는 needle_trick_k
#                        → 멈추기 2초 전 CHA_RL_a_call_bets + betlock(경기장 중앙) → 판정: 맞힌 사람 win / lose(+Z = 안전 구역 방향) / table
#   카드 날리기          CHA_RL_a_card_throw (0.5초 손 휘두름)  card(projectile) + card_hit  — 부채꼴 5갈래 직선 폭 1.5 × 18, 사이 각도로 한 번 더
#   칩 탑 낙하           CHA_RL_a_chip_drop + CA_Roulette_chip_tower drop  chip_drop(착지 0.12초) — 원 r3 네 곳 0.3초 간격
#   주사위 굴리기        CHA_RL_a_dice_roll + CA_Roulette_dice roll/land_n  dice_trail(attached) → pip_n(+Z = 첫 줄 방향)
#   딜러의 손            CHA_RL_a_dealer_hand  dealer_cross → dealer_x — 십자 직선 폭 3 × 16 → 45° 돌려 X자
#   동전 던지기          CHA_RL_a_coin_flip + CA_Roulette_coin flip_heads/flip_tails  coin_heads(r8) / coin_tails(8~18)
#   올인                 CHA_RL_a_all_in (0.85초 내려찍기)  all_in — 앞 반원 r10
#   칩 회수              CHA_RL_a_chip_recall  recall(link, 칩마다) — 경로 직선 여러 개
#   그로기 (적중·하우스 룰)  CHA_RL_a_groggy + groggy(attached 반복)
#   광폭화 (30%)         CHA_RL_a_enrage + enrage → enrage_aura(attached 반복)

CHA_RL_clear:
  Skills:
  - state{s=spin_cast;r=true} @self
  - state{s=groggy;r=true} @self
  - state{s=needle_fast;r=true} @self

# ---------------- 룰레타
CHA_RL_a_spawn:
