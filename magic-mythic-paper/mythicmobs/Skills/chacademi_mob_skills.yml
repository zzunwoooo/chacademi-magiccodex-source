# 차카데미 몹 전용 스킬 (손으로 관리) - 예고 장판은 chatelegraph 가 그리고, 같은 모양으로 판정합니다.
# 적 공격 예고는 빨간색 고정 (모드 TelegraphClient). VFX 는 PortableVFX 팩 (claude:<팩>/<시스템>).
#
# 몹에 붙이는 법 (Mobs/chacademia_custom.yml 의 해당 몹 "Skills" 아래에 한 줄 추가):
#   "CA_Wild_mf_warden_mage":        - "skill{s=CHA_MOB_seal_circle} @target ~onTimer:100 0.5"
#   "CA_Wild_mf_warden_mage_shiny":  - "skill{s=CHA_MOB_seal_circle_shiny} @target ~onTimer:100 0.5"
#   "CA_Wild_glacialcore":          - "skill{s=CHA_MOB_frost_laser} @target ~onTimer:120 0.5"
#   "CA_Wild_glacialcore_shiny":    - "skill{s=CHA_MOB_frost_laser_shiny} @target ~onTimer:120 0.5"
# 이로치는 같은 스킬에 VFX 시스템만 이로치 색(seal_ruby / laser_obsidian).

# 봉인의 술사 - 봉인진: 대상 발밑 반경 4 원형 예고 1.2초 -> 봉인 발동, 피해 4 + 무장해제 1.5초
# 시전 모션: seal_cast (1.6초, 1.2초에 내려찍기 = 봉인 발동). 모델 ca_mf_warden_mage(_s).bbmodel 에 추가됨.
CHA_MOB_seal_circle:
  Cooldown: 10
  Conditions:
  - targetwithin{d=20} true
  Skills:
  - state{s=seal_cast;li=0;lo=3} @self
  - chatelegraph{shape=circle;at=target;r=4;ticks=24;flat=4;element=light;status=disarm:30;vfx=sealcircle/seal;vfxref=4;vfxlead=2;spell=mob_seal_circle} @target

CHA_MOB_seal_circle_shiny:
  Cooldown: 10
  Conditions:
  - targetwithin{d=20} true
  Skills:
  - state{s=seal_cast;li=0;lo=3} @self
  - chatelegraph{shape=circle;at=target;r=4;ticks=24;flat=4;element=light;status=disarm:30;vfx=sealcircle/seal_ruby;vfxref=4;vfxlead=2;spell=mob_seal_circle} @target

# 빙핵의 수호자 (고위) - 빙핵 레이저: 시전자 앞 직선 길이 16 · 폭 2 예고 1.2초 -> 관통 광선, 피해 8 + 둔화 2초(40%)
# 시전 모션: frost_laser (2.0초, 1.12~1.2초 발사 반동). 모델 ca_glacialcore(_s).bbmodel 에 추가됨.
CHA_MOB_frost_laser:
  Cooldown: 12
  Conditions:
  - targetwithin{d=16} true
  Skills:
  - state{s=frost_laser;li=0;lo=4} @self
  - chatelegraph{shape=line;at=caster;length=16;width=2;ticks=24;flat=8;element=water;status=slow:40:0.4;vfx=frostlaser/laser;vfxref=16;vfxlead=2;spell=mob_frost_laser} @target

CHA_MOB_frost_laser_shiny:
  Cooldown: 12
  Conditions:
  - targetwithin{d=16} true
  Skills:
  - state{s=frost_laser;li=0;lo=4} @self
  - chatelegraph{shape=line;at=caster;length=16;width=2;ticks=24;flat=8;element=water;status=slow:40:0.4;vfx=frostlaser/laser_obsidian;vfxref=16;vfxlead=2;spell=mob_frost_laser} @target
