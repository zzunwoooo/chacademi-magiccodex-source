# 빼빼로데이 3인 던전 「초코 막대 공방」 스킬 (2026-11-11 개편). 몹은 Mobs/chacademi_boss_pepero.yml.
# 보스 쇼콜라의 패턴·기믹 7종·대사는 전부 애드온 chapepero (PeperoBoss.java). 여기에는 애드온이 부르는 모션(CHA_PEP_a_*)과 졸개 스킬만 있다.
# VFX: claude:pepchocola/<시스템> (공격, 흰 초코 = _w) · pepsweet/* (연출) · pepgimmick/* (기믹). 졸개 피해는 chatelegraph (던전 이지 배율 적용).

# ============================================================ 보스 모션 (애드온 anim("<이름>") → CHA_PEP_a_<이름>, 분신도 같은 스킬)
CHA_PEP_a_spawn:
  Skills:
  - state{s=spawn;li=0;lo=3} @self
CHA_PEP_a_attack:
  Skills:
  - state{s=attack;li=0;lo=2} @self
CHA_PEP_a_swing:
  Skills:
  - state{s=swing;li=0;lo=3} @self
CHA_PEP_a_stick_rain:
  Skills:
  - state{s=stick_rain;li=0;lo=3} @self
CHA_PEP_a_puddle:
  Skills:
  - state{s=puddle;li=0;lo=3} @self
CHA_PEP_a_almond_throw:
  Skills:
  - state{s=almond_throw;li=0;lo=3} @self
CHA_PEP_a_cross:
  Skills:
  - state{s=cross;li=0;lo=3} @self
CHA_PEP_a_fondue_charge:
  Skills:
  - state{s=fondue_charge;li=0;lo=3} @self
CHA_PEP_a_fondue_burst:
  Skills:
  - state{s=fondue_burst;li=0;lo=3} @self
CHA_PEP_a_pair_call:
  Skills:
  - state{s=pair_call;li=0;lo=3} @self
CHA_PEP_a_gift_summon:
  Skills:
  - state{s=gift_summon;li=0;lo=3} @self
CHA_PEP_a_shield:
  Skills:
  - state{s=shield;li=2;lo=4} @self
  - delay 60
  - state{s=shield;r=true} @self
CHA_PEP_a_stunned:
  Skills:
  - state{s=stunned;li=0;lo=3} @self
CHA_PEP_a_enrage:
  Skills:
  - state{s=enrage;li=0;lo=3} @self
CHA_PEP_a_blink:                    # 진짜 쇼콜라 찾기: 진짜만 깜빡임 (분신은 안 부름)
  Skills:
  - state{s=blink;li=0;lo=0} @self

# ============================================================ 졸개 (애드온이 부름, 최대 6마리)
PEP_MINION_SPAWN_LOCK:
  Skills:
  - chavfx{id=pepsweet/summon} @self
  - state{s=spawn;li=0;lo=3} @self
  - setAI{ai=false} @self
  - delay 22
  - setAI{ai=true} @self

PEP_SOLDIER_POKE:                   # attack 1.0초, 0.45초 찌르기 (체술, 예고 없음)
  Cooldown: 1.5
  Skills:
  - state{s=attack;li=0;lo=2} @self
  - chatelegraph{shape=cone;at=caster;r=2.6;angle=90;ticks=9;warn=false;flat=8;element=earth;spell=mob_pep_soldier_poke} @target
PEP_SOLDIER_THRUST:                 # thrust 1.4초, 0.75초 돌진 — 직선 6×1.5
  Cooldown: 4
  Skills:
  - setAI{ai=false} @self
  - look{} @target
  - state{s=thrust;li=0;lo=3} @self
  - chatelegraph{shape=line;at=caster;length=6;width=1.5;ticks=15;flat=12;element=earth;vfx=pepchocola/soldier_thrust;vfxref=6;vfxlead=2;spell=mob_pep_soldier_thrust} @target
  - delay 14
  - lunge{velocity=1.4;velocityY=0.15} @target
  - delay 14
  - setAI{ai=true} @self

PEP_ALMOND_BUMP:                    # 몸통 박치기 (체술)
  Cooldown: 1.5
  Skills:
  - state{s=attack;li=0;lo=2} @self
  - chatelegraph{shape=circle;at=caster;r=1.6;ticks=6;warn=false;flat=6;knock=0.6;element=earth;spell=mob_pep_almond_bump} @target
PEP_ALMOND_ROLL:                    # roll 1.6초, 0.6초부터 굴러옴 — 직선 8×2, 넉백
  Cooldown: 4
  Skills:
  - setAI{ai=false} @self
  - look{} @target
  - state{s=roll;li=0;lo=3} @self
  - chatelegraph{shape=line;at=caster;length=8;width=2;ticks=12;flat=11;knock=1;element=earth;vfx=pepchocola/almond_roll;vfxref=8;vfxlead=2;spell=mob_pep_almond_roll} @target
  - delay 11
  - lunge{velocity=1.8;velocityY=0.1} @target
  - delay 20
  - setAI{ai=true} @self

PEP_FAIRY_SPRINKLE:                 # sprinkle 1.6초, 1.0초 — 원 r3 대상 발밑, 둔화 (VFX 0.4초 낙하)
  Cooldown: 3
  Skills:
  - look{} @target
  - state{s=sprinkle;li=0;lo=3} @self
  - chatelegraph{shape=circle;at=target;r=3;ticks=20;flat=9;status=slow:30:0.3;element=light;vfx=pepchocola/fairy_sprinkle;vfxref=3;vfxlead=8;spell=mob_pep_fairy_sprinkle} @target
