# 빼빼로데이 3인 던전 「초코 막대 공방」 — 학교 plugins/ChacaDungeon/dungeons.yml 의 dungeons: 아래에 붙인다 (2026-11-11).
# 맵 = 달콤한 악몽(sweet_nightmare) 칸 1~3 그대로 (대기실 + 반경 20 경기장). 입구(portal)도 같은 곳이라
# 이벤트 동안 sweet_nightmare 는 portal 을 치우거나 permission 을 막아 둘 것 (같은 칸에 두 던전 파티가 겹치지 않게).
# 입장 허가는 의뢰 「공방의 SOS」(pep_q1_sos) 보상으로 줌. 클리어마다 의뢰 이벤트 pep_clear +1 (각자).
  pepero_day:
    name: 초코 막대 공방
    subtitle: 외톨이 마녀 쇼콜라
    world: dungeon1
    permission: chacademi.dungeon.enter.pepero_day
    lock-message: 제과부 코코를 찾아가 보자.
    ticket:
      item: item:dungeon_ticket
      amount: 1
      free-until-first-clear: true
    instances: 3
    portal: world,444.24,108.00,-51.51,0.8,-5.0
    portal-radius: 2.5
    portal-label: 초코 막대 공방
    exit: world,390.44,108.00,-64.42,87.0,4.7
    clear-commands:
    - 테스트 의뢰 이벤트 pep_clear 1 {player}
    rewards:
      first:
      - item: item:random_artifact
        amount: 1
      - item: item:gift_ticket
        amount: 3
      base:
      - item: item:core_unidentified
        amount: 3
      - item: item:core_unidentified
        amount: 3
      - item: item:money_pouch
        amount: 5
      - item: item:health_potion_big
        amount: 2
      random:
      - item: item:random_artifact
        amount: 1
        chance: 15.0
      - item: item:core_scroll_blue
        amount: 1
        chance: 10.0
      - item: item:artifact_ticket_unique
        amount: 1
        chance: 2.0
      - item: item:artifact_ticket_legendary
        amount: 1
        chance: 0.5
    difficulty:
      easy:
        health: 0.6666666666666666
        damage: 0.5
      hard:
        health: 1.0
        damage: 1.0
    easy-rewards:
      first:
      - item: item:random_artifact
        amount: 1
