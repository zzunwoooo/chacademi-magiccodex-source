    natural-regen: false
    party-size: 3
    art: pepero_day
    stages:
    - name: 초코 막대 공방
      goal: 달콤한 냄새가 난다. 공방 안으로 들어가자.
      type: reach
      target: 입장
      radius: 3.0
      open-doors:
      - wait door
    - name: 외톨이 마녀 쇼콜라
      goal: 공방을 차지한 쇼콜라를 막고 빼빼로를 되찾자!
      type: boss
      target: chocola
