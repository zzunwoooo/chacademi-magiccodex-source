# 빼빼로데이 이벤트 의뢰 (2026-11-11) — 학교 plugins/MagicCodexBridge/quests.yml 의 quests: 아래에 붙이고 /의뢰관리 reload (공용 DB 로 퍼짐).
# 이벤트 끝나면 enabled: false 로 바꾸고 reload.
# 목표 신호:
#  - daily_custom_kill = 브리지가 야생 커스텀 몹 처치마다 보내는 기존 신호 (일일 「몬스터 토벌」과 같은 것, 같이 오름)
#  - pep_clear = 던전 「초코 막대 공방」 clear-commands 가 클리어한 사람마다 +1 (/테스트 의뢰 이벤트 pep_clear 1 <이름>)
#    ※ 보스가 죽을 때 이미 쓰러져 관전 중이던 사람은 의뢰가 안 오름 (브리지가 관전자 진행을 무시함). 던전 클리어 기록·보상은 받음.
#  - MYTHIC_KILL = 막타 친 사람만 오름
# 일일 의뢰는 하루 3개 상한(DailyHooks)에 같이 묶여서 만들지 않음 — 반복은 pep_q5 의 3번 클리어로 대신.
quests:
  pep_q1_sos:
    title: 공방의 SOS
    description: 제과부 공방이 이상한 마녀에게 넘어갔대요! 빼빼로 재료를 지키느라 지친 코코를 대신해, 숲의 몬스터를 정리하며 공방으로 가는 길을 열어 주세요.
    reward:
      label: 초코 막대 공방 입장 허가 · 재화 주머니 3개
      commands:
      - lp user {player} permission set chacademi.dungeon.enter.pepero_day true
      - iagive {player} item:money_pouch 3 silent
      money: 0.0
      items: []
      house-points: 0
    main: false
    permission: ''
    requires: []
    rank: C
    daily: false
    enabled: true
    opens-at: ''
    completion-limit: 1
    objectives:
    - type: EVENT
      target: daily_custom_kill
      server: ''
      label: 몬스터 처치
      amount: 30
      world: ''
  pep_q2_rescue:
    title: 빼빼로를 되찾아라
    description: 공방 깊은 곳에서 외톨이 마녀 쇼콜라가 빼빼로를 전부 끌어안고 있어요. 친구 둘과 함께 초코 막대 공방에 들어가 쇼콜라를 막아 주세요.
    reward:
      label: 미확인 코어 3개
      commands:
      - iagive {player} item:core_unidentified 3 silent
      money: 0.0
      items: []
      house-points: 0
    main: false
    permission: ''
    requires:
    - pep_q1_sos
    rank: B
    daily: false
    enabled: true
    opens-at: ''
    completion-limit: 1
    objectives:
    - type: EVENT
      target: pep_clear
      server: ''
      label: 초코 막대 공방 클리어
      amount: 1
      world: ''
  pep_q3_soldier:
    title: 막대 병정 정리
    description: 마법이 덜 풀린 초코 막대 병정들이 아직도 공방을 행진하고 있어요. 병정들을 쓰러뜨려 다시 빼빼로로 돌려 주세요.
    reward:
      label: 큰 마나 포션 3개
      commands:
      - iagive {player} item:mana_potion_big 3 silent
      money: 0.0
      items: []
      house-points: 0
    main: false
    permission: ''
    requires:
    - pep_q2_rescue
    rank: C
    daily: false
    enabled: true
    opens-at: ''
    completion-limit: 1
    objectives:
    - type: MYTHIC_KILL
      target: CA_Pep_stick_soldier
      server: ''
      label: 초코 막대 병정 처치
      amount: 15
      world: ''
  pep_q4_almond:
    title: 굴러다니는 아몬드
    description: 선물 상자에서 튀어나온 아몬드 굴림이들이 공방 바닥을 데굴데굴 굴러다녀요. 밟히기 전에 붙잡아 주세요.
    reward:
      label: 큰 체력 포션 3개
      commands:
      - iagive {player} item:health_potion_big 3 silent
      money: 0.0
      items: []
      house-points: 0
    main: false
    permission: ''
    requires:
    - pep_q2_rescue
    rank: C
    daily: false
    enabled: true
    opens-at: ''
    completion-limit: 1
    objectives:
    - type: MYTHIC_KILL
      target: CA_Pep_almond_roller
      server: ''
      label: 아몬드 굴림이 처치
      amount: 10
      world: ''
  pep_q5_share:
    title: 쇼콜라에게도 빼빼로를
    description: 쇼콜라는 사실 빼빼로를 한 번도 받아 본 적이 없대요. 공방을 몇 번 더 찾아가 쇼콜라와 마주해 주세요. 언젠가는 마음을 열지도 몰라요.
    reward:
      label: 랜덤 아티팩트 1개 · 호감도 선물 뽑기권 2개
      commands:
      - iagive {player} item:random_artifact 1 silent
      - iagive {player} item:gift_ticket 2 silent
      money: 0.0
      items: []
      house-points: 0
    main: false
    permission: ''
    requires:
    - pep_q3_soldier
    - pep_q4_almond
    rank: A
    daily: false
    enabled: true
    opens-at: ''
    completion-limit: 1
    objectives:
    - type: EVENT
      target: pep_clear
      server: ''
      label: 초코 막대 공방 클리어
      amount: 3
      world: ''
