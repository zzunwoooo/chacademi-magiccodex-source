# 이 파일은 서버 plugins/ChacademyStory/dialogues/ch1_wakeup.yml 로 넣는다 (클라에는 없어도 됨)
# 명령어 안의 {player} = 마인크래프트 닉네임, {nickname} = 한글 닉네임
npcs: [teacher]   # 대화를 열 때 이 NPC들의 호감도를 MagicCodex에서 가져옴
end:
  - "say {nickname} 님이 깨어남 대화를 마쳤습니다 (마지막 장면: {scene})"
endings:
  go_friend:
    - "say {nickname} 님은 선생님과 친해졌습니다"
events:
  told_dream:
    - "say {nickname} 님이 꿈 이야기를 했습니다"
