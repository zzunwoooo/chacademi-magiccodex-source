# 차카데미 스토리 진행 단계 (1장 기본값, Claude 2026-10-20)
# 명령어(/대화관리 단계 ...)로 고치면 이 파일이 바로 저장됩니다. 직접 고친 뒤에는 /서버관리 새로고침 스토리.
#
# 흐름: 앞 단계 대화가 끝나면 이 단계가 시작 → 조건을 다 채우면 "준비 완료"(포탈·NPC 징표 표시) → 호출 → 대화(+컷신) → 다음 단계
#   장     HUD 맨 위 장 이름          설명   HUD 큰 글씨 (상황 설명)
#   조건   종류: 아이템(가지고 있기) · 제출(호출 때 걷음) · 처치 · 상호작용(블록 우클릭) · 대화완료 · 신호(/대화관리 신호)
#          대상: 아이템은 재료 이름(DIAMOND) · 재료|이름 · 이름:글자 , 처치는 * · 몹 종류(ZOMBIE) · 이름:글자
#          개수, 표시(HUD 글, 없으면 자동), 숨김(true면 HUD에 안 보임), 블록(상호작용 대상 "월드,x,y,z")
#   호출   종류: 없음 · 자동(지연 초) · NPC클릭(서버 + Citizens 번호) · 위치(월드 x y z 반경) · 컷신(그 컷신을 다 보면)
#   대화   호출되면 띄울 대화 ID    컷신  대화 다음(또는 대화 없이) 재생할 컷신    다음  다음 단계 (비우면 끝)
#   시작명령  단계에 들어갈 때 콘솔로 실행 (조건을 못 채운 채 다시 접속해도 한 번 더). 대화완료 대상은 | 로 여러 개, 끝 * = 앞부분이 같은 모든 대화
#   시작명령-한번  true = 그 단계에 들어간 회차마다 딱 한 번 (실행 전에 기록 저장 → 재접속·대화 닫기·서버 재시작에도 다시 안 함)
#             false = 여러 번 실행될 수 있음 (여러 번 실행해도 결과가 같은 명령만! 예: 기숙사분류 시작)
#             생략 = 명령에 지급·주기·칭호·아이템관리·give·permission set 같은 말이 있으면 true, 없으면 false
#             ※ 아이템·칭호·권한·재화를 주는 명령은 반드시 true 로 두세요 (아니면 재접속마다 또 지급됩니다)
#   신호   교화성공(MagicCodexBridge 교화 저장 뒤) · 낚시성공(물고기가 통발 수조에 저장된 뒤) · 연금술성공(제작 결과 지급 뒤) · 내방열기(ChacaHousing 내 방을 읽어 연 뒤)
#
# Skript 는 필요 없습니다. 기숙사 분류는 MagicCodexBridge 의 /기숙사분류 시작·결정 (기존 Java)을 씁니다.
#
# NPC·포탈 위치는 아직 비어 있습니다 (호출: 없음). 게임 안에서:
#   /대화관리 단계 ch1-8 호출 NPC클릭   → 30초 안에 피피 클릭
#   /대화관리 단계 ch1-6 호출 위치 2    → 지금 선 자리에 반경 2 포탈
#   /대화관리 단계 ch1-19 조건 블록지정 1 → 이론서 블록 3개 우클릭 → /대화관리 단계 지정끝

