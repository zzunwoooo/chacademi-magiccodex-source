# 차카데미 하우징 (기숙사 내 방 꾸미기). /하우징관리 리로드 로 다시 읽습니다.
# DB 는 plugins/ChacaHousing/database.properties (MagicCodexBridge 와 같은 형식, 공용 MariaDB 를 써야 학교·야생에서 같은 방이 보입니다).

# 이 서버 이름 (구경 중 명단·접속 표시에만 씀). 학교 서버는 school, 야생은 wild 처럼.
server-name: school

# 처음 방 크기 (N×N 칸, 최대 32)
start-size: 15

# 방 확장: 넓힐 크기 → 그 크기로 넓히는 비용 (Vault 돈). 위에서부터 차례로 한 단계씩 넓어집니다.
# ※ 비용은 임시 값입니다. 오너가 정해 주세요.
expansion:
  18: 20000
  21: 50000
  24: 100000

# /방구경 <닉네임> 을 기숙사실 밖에서도 쓸 수 있게 할지
visit-command: true

guestbook:
  cooldown-seconds: 10   # 한 사람이 글을 연달아 쓸 수 있는 간격
  keep: 100              # 방마다 남겨 두는 글 수 (오래된 것부터 지움)

# 구경 중 명단·방 변경을 다른 서버와 맞추는 주기 (틱, 20틱 = 1초)
presence-interval-ticks: 40
